[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mousedroid"
version = "0.3.0"
description = "MouseDroid — Star Wars MSE-6 Autonomous Navigation System on Jetson Orin Nano"
requires-python = ">=3.10"
authors = [{ name = "Ian Cruickshank", email = "ianshank@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
# NOTE (PEP 639): the SPDX `license = "MIT"` expression replaces the legacy
# `License :: OSI Approved :: MIT License` classifier — modern hatchling rejects
# declaring both, so the classifier list below intentionally omits it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "structlog>=23.0",
    "lmdb>=1.4",
    # <2.5: numpy 2.5.0 (requires-python >=3.12) ships PEP 695 `type` stubs that
    # mypy rejects under the repo-wide python_version = "3.10" target; lift the
    # bound once [tool.mypy] targets per-interpreter versions.
    "numpy>=1.24,!=2.0.0,!=2.0.1,<2.5",
    "pyyaml>=6.0",
    "msgpack>=1.0",
    "networkx>=3.0",
    "faiss-cpu>=1.7",
    "cachetools>=5.0",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
hardware = [
    "Jetson.GPIO>=2.1",
    "pyserial>=3.5",
    "picamera2>=0.3",
    "pyaudio>=0.2.13",
    # SSD1306 OLED face display (I²C). Pillow is also listed in `telemetry`
    # but is intentionally duplicated here so bare-Jetson hardware deploys
    # don't need the telemetry stack just to drive the face panel.
    "luma.oled>=3.12",
    "Pillow>=10.0",
    "smbus2>=0.4",
]
audio = [
    "pyaudio>=0.2.13",
]
voice = [
    "piper-tts>=1.2",
]
jetson = [
    "tensorrt>=8.0",
    "pycuda>=2022.1",
]
telemetry = [
    "aiohttp>=3.9",
    "zeroconf>=0.80",
    "Pillow>=10.0",
]
mcp = [
    # Upper-bounded at <2 because mcp 2.0 is a breaking major that this
    # codebase has not been migrated to, and the old `>=1.0` happily resolved
    # to it (same class of bug as the ruff/coverage pin skews). Two concrete
    # incompatibilities, both pinned green on 1.x by tests/unit/mcp/:
    #   * `Tool.inputSchema` became an ALIAS for a renamed `input_schema`
    #     field, so construction still works but attribute reads raise
    #     AttributeError (tests/unit/mcp/test_transport.py).
    #   * `Resource.uri` changed from `AnyUrl` to `str`, so the `AnyUrl(uri)`
    #     in mcp/transport.py::_on_list_resources fails validation.
    # Lifting this bound is a deliberate migration, not a version bump.
    "mcp>=1.0,<2",
    "anyio>=4.0",
]
mlflow = [
    "mlflow-skinny>=2.22,<4",
    # The default tracking_uri (ExperimentLoggerConfig.tracking_uri) is a
    # sqlite:/// URI; mlflow's sqlite tracking store needs these two —
    # mlflow-skinny alone raises UnsupportedModelRegistryStoreURIException
    # for any sqlite:/// URI without them. Upper-bounded at each package's
    # next major, same discipline as this file's other extras (cf. `mcp`'s
    # `<2`, `isaaclab`'s `<0.30`) — a 2.x/1.x break here degrades gracefully
    # anyway (build_experiment_logger falls back to NoOp on ImportError or
    # construction failure), but an unbounded range would still risk a
    # silent behavior change on the next major release of either.
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]
llm = [
    "llama-cpp-python>=0.2",
    "huggingface-hub>=0.20",
]
vla = [
    "onnxruntime-gpu>=1.18; platform_machine=='aarch64'",
    "onnxruntime>=1.18; platform_machine!='aarch64'",
    "transformers>=4.40",
    "huggingface-hub>=0.20",
]
onnx_world_model = [
    # Mirrors the [vla] backend: same ORT split for Jetson aarch64 vs x86 +
    # huggingface-hub for the optional HF auto-download path in the factory.
    "onnxruntime-gpu>=1.18; platform_machine=='aarch64'",
    "onnxruntime>=1.18; platform_machine!='aarch64'",
    "onnx>=1.15",
    # ``torch.onnx.export`` in torch>=2.6 unconditionally imports
    # ``onnxscript`` at function-call time (even when ``dynamo=False`` is
    # passed). The B2 export script + smoke tests touch ``torch.onnx.export``
    # under this extras, so the dep must be present. The [vla] extras don't
    # need it because the VLA path only LOADS .onnx via onnxruntime — it
    # never invokes the exporter.
    "onnxscript>=0.2",
    "huggingface-hub>=0.20",
]
arm = [
    "gymnasium>=0.29",
    "mujoco>=3.0",
    "stable-baselines3>=2.0",
    "pyperplan>=2.0",
    "ultralytics>=8.0",
    "scipy>=1.10",
]
# Isaac Lab + Isaac Sim are NOT installed by CI. The dep is declared here
# so workstation users can opt in with `pip install -e ".[isaac]"` and so
# the rover env stub at src/mousedroid/sim/isaaclab/ has a documented
# install path. Tests detect availability via the
# ``_isaaclab_available()`` helper in that module and skip Isaac-Lab-only
# cases with ``@pytest.mark.skipif(not _isaaclab_available(), ...)``.
isaac = [
    # Tier C4 pins the upper bound — Isaac Lab tracks aggressive API
    # iteration on its 0.x line; pinning <0.30 keeps the operator's
    # Linux validation playbook (ADR-009 amendment) reproducible.
    "isaaclab>=0.20,<0.30",
    "gymnasium>=0.29",
]
hailo = [
    "hailort>=4.18",
]
lidar = [
    "pyserial>=3.5",
]
cfc = [
    "ncps>=0.0.7",
]
anthropic = [
    "anthropic>=0.40",
]
gcp = [
    "google-cloud-pubsub>=2.18",
    "google-cloud-storage>=2.10",
    "google-cloud-logging>=3.5",
    "google-cloud-monitoring>=2.16",
    "google-cloud-firestore>=2.11",
    "google-auth>=2.20",
]
gcp-training = [
    "google-cloud-aiplatform>=1.38",
    "kfp>=2.4",
]
gcp-simulation = [
    "google-cloud-container>=2.30",
    "kubernetes>=27.0",
]
dev = [
    "pytest>=7.0",
    # TOML backend for Python 3.10 (stdlib tomllib lands in 3.11). pytest
    # already pulls tomli in transitively there; declared explicitly because
    # tests/regression/test_numpy_mypy_target_compat.py imports it directly.
    'tomli>=2.0 ; python_version < "3.11"',
    # Same explicit-not-transitive rule: the numpy/mypy-target regression test
    # imports packaging.specifiers directly (pytest also pulls it in).
    "packaging>=21.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.0",
    "hypothesis>=6.80",
    # Pinned to match .github/workflows/ci.yml AND release.yml — newer ruff
    # versions wrap lines slightly differently, so a wider range here causes
    # `ruff format --check src/ tests/` to fail in CI even when it passes
    # locally. Both workflows `pip install` ruff standalone rather than via
    # this extra, so all THREE literals must move in the same change;
    # tests/regression/test_ruff_version_single_source.py enforces it.
    "ruff==0.16.2",
    # Pinned (same discipline as ruff) to match .github/workflows/ci.yml. mypy
    # minor releases tighten strict-mode inference — e.g. 2.x flags untyped
    # aiohttp ``@web.middleware`` decorators and rejects implicit union type
    # aliases that 1.x accepted — so an unbounded ``>=`` silently breaks the CI
    # typecheck stage while passing on an older local mypy. Bump here + in CI
    # together. NOTE: the typecheck job installs ``.[dev,telemetry]`` so PIL +
    # aiohttp real types are visible to mypy (otherwise those annotations
    # degrade to ``Any`` under ``--ignore-missing-imports`` and surface
    # ``valid-type`` / ``untyped-decorator`` errors).
    "mypy==2.3.1",
    "types-PyYAML>=6.0",
    # PR-105b: close the second pre-existing mypy --strict error.
    # ``src/mousedroid/reward/vlm_progress.py:31`` imports ``cachetools``
    # which ships no type stubs in the upstream wheel; the stub package
    # below resolves the `[import-untyped]` mypy error without polluting
    # the runtime install (it's [dev]-only).
    #
    # PR-105b harden gap-fix #7: lower bound aligned with the runtime
    # ``cachetools>=5.0`` pin at line 21 so environments resolving any
    # supported runtime version get matching stubs. Upper bound ``<6``
    # pins the major to defend against a hypothetical breaking 6.0
    # release that wouldn't reflect runtime API.
    "types-cachetools>=5.0,<8",
    "ncps>=0.0.7",
    # Spec-driven harness (HARNESS_SPEC.md / ADR-012): scripts/validate.py and
    # tests/regression/test_harness_spec_aqa.py validate features.yaml against
    # features.schema.json. jsonschema is [dev]-only — the harness is a CI/agent
    # tool surface, not a runtime dependency of the rover brain.
    "jsonschema>=4.0",
    "types-jsonschema>=4.0",
    # Dead-code audit (F-020) - advisory scripts/dead_code_audit.py; the
    # script + tests skip cleanly when absent.
    "vulture>=2.0",
]

[project.scripts]
mousedroid = "mousedroid.main:cli_entry"

[project.urls]
Homepage = "https://github.com/ianshank/mouse-droid-agi"
Repository = "https://github.com/ianshank/mouse-droid-agi"
Documentation = "https://github.com/ianshank/mouse-droid-agi/blob/main/docs/README.md"
Changelog = "https://github.com/ianshank/mouse-droid-agi/blob/main/CHANGELOG.md"
Issues = "https://github.com/ianshank/mouse-droid-agi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mousedroid"]
# Internal agent instructions are not part of the distribution; without this
# the wheel ships 22 CLAUDE.md / agent.md files (~19 KB) to PyPI.
exclude = ["**/CLAUDE.md", "**/agent.md"]
# No force-include block: hatchling's `packages =` above already includes every
# file under the package directory (dashboard.html ships today despite never
# having been listed), so the former block was dead config whose only live
# effect was a FileNotFoundError in a partial build context.


[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    # C901 = McCabe cyclomatic complexity (distinct from C4 = comprehensions).
    # Ceiling set in [tool.ruff.lint.mccabe] below; pre-existing offenders are
    # baselined in per-file-ignores as a ratchet backlog.
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT",
    "S", "ANN", "D", "T20", "C901", "NPY",
]
ignore = ["D100", "D104", "D107", "D203", "D213", "S101", "ANN401", "TCH", "TC"]

[tool.ruff.lint.per-file-ignores]
# NPY002 (legacy np.random.* global-RNG calls) baselined for tests/ only: a
# repo-wide sweep found 50 pre-existing hits, all confined to test-fixture
# mock-data generation (zero in src/mousedroid) -- production code is
# already clean, so the rule stays LIVE and enforced there. Fixing the 50
# test call sites requires a real design decision (a shared np.random.Generator
# fixture vs. a per-file module-level instance), not a mechanical rewrite --
# tracked as follow-up, not baselined silently: see NEXT_STEPS.md.
"tests/**/*.py" = ["D", "ANN", "S101", "S108", "S603", "S607", "E402", "NPY002"]
"tools/**/*.py" = ["D", "ANN", "T20"]
# Operator/CI scripts are procedural glue (already exempt from D/T20). C901 is
# baselined here for the three current offenders (check_branch_coverage.py::main
# cc 21, jetson_probe_lidar_raw_ws.py / jetson_probe_ws_negotiation.py::_probe
# cc 17/16) rather than per-file so the operational tooling is not forced into
# premature decomposition.
"scripts/**/*.py" = ["D", "T20", "S603", "S104", "E501", "C901"]
# Harness / skills / LLM replanner: protocol method docstrings live on the
# Protocol classes (and on the concrete classes' class docstrings) so the
# per-method D102 / D105 rule produces redundant boilerplate. Class-level
# docstrings remain mandatory.
"src/mousedroid/harness/**/*.py" = ["D102", "D105"]
"src/mousedroid/skills/**/*.py" = ["D102", "D105"]
"src/mousedroid/arm/planning/llm_replanners/**/*.py" = ["D102"]
# Hardware-diagnostics module shells out to fixed, PATH-resolved system tools
# (lspci / lsblk / smartctl / findmnt), each guarded by ``shutil.which`` with a
# constant argv list and no shell — S603 (untrusted input) and S607 (partial
# path) are structurally inapplicable here. Lives in the PCIe/SSD domain
# submodule of the validation.runtime package (split from the former flat
# validation/runtime.py).
"src/mousedroid/validation/runtime/_storage.py" = ["S603", "S607"]
# Spec-driven harness runner (ADR-012): git_rev_ok shells out to a fixed
# `git rev-parse` argv (S603/S607) and run_validation executes the operator-
# authored validation_command via the shell (S602). Both are by design — see
# the inline rationale. Suppress here (not inline) to keep the src/ noqa budget
# (tests/regression/test_suppression_budget.py) flat.
"src/mousedroid/harness/spec.py" = ["S602", "S603", "S607"]
# C901 cyclomatic-complexity gate (max-complexity=15, see [tool.ruff.lint.mccabe]
# below) is enforced across all of src/ with NO baseline: every pre-existing
# offender (telemetry/metrics.py::render_prometheus, telemetry/server.py's
# _handle_mission_post + _broadcast_loop, orchestrator/orchestrator.py's
# start + stop) was decomposed below the ceiling. Do not add a file-level C901
# ignore here to work around a complex function — decompose it instead. (The
# only remaining C901 baseline is the scripts/ glob above, for procedural glue.)

[tool.ruff.lint.mccabe]
# Cyclomatic-complexity ceiling (the refactoring task's "< 15" requirement).
# Deliberately 15, not 10: at 10 the src/ backlog balloons from 5 to ~23
# functions. Tighten later once the current baseline is cleared.
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# The pydantic mypy plugin teaches strict mode that BaseModel/BaseSettings
# subclasses with all-default fields are constructible with no arguments —
# eliminating spurious [call-arg] errors at every ``SomeConfig()`` call site
# (three_laws, mission_parser, laundry_rules, pipeline_orchestrator) without
# per-call ``# type: ignore[call-arg]`` suppressions.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "mousedroid.config.schema.root",
    "mousedroid.llm_gateway.config",
    "mousedroid.world_model.encoder",
    "mousedroid.world_model.rssm",
    "mousedroid.world_model.mcts",
    "mousedroid.scaling.moe",
    "mousedroid.scaling.adaptive",
    "mousedroid.reward.model",
    "mousedroid.learning.progressive",
    "mousedroid.curiosity.icm",
    "mousedroid.growth.distillation",
    "mousedroid.arm.control.sac_agent",
    "mousedroid.arm.perception.object_detector",
    "mousedroid.arm.perception.depth_processor",
    "mousedroid.hardware.accelerator.hailo_runtime",
    "mousedroid.arm.perception.hailo_detector",
    "mousedroid.world_model.cfc_cell",
    "mousedroid.world_model.dual_stream_rssm",
    "mousedroid.world_model.stream_fusion",
    "mousedroid.cloud.pubsub_sink",
    "mousedroid.cloud.experience_exporter",
    "mousedroid.cloud.logging_sink",
    "mousedroid.cloud.monitoring_exporter",
    "mousedroid.cloud.firestore_sync",
    "mousedroid.cloud._auth",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# pydantic-settings BaseSettings + Field(default_factory=...) produces
# false-positive arg-type errors with mypy strict mode.
module = ["mousedroid.config.schema.root"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
# The optional ``mcp`` SDK does not (yet) ship type stubs reliably;
# allow strict-mode runs without forcing the extra to be installed.
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "hardware: marks tests requiring real hardware",
    "smoke: marks smoke tests for end-to-end telemetry stack validation",
    "pillar: marks tests as part of the Ten-Pillars validation campaign (nightly regression net)",
]
# --import-mode=importlib is load-bearing: several test basenames exist in
# both tests/unit/ and a tier subdirectory (e.g. test_profiler.py), which the
# default prepend import mode cannot disambiguate. CI invocations also pass
# the flag explicitly; keep the two in sync.
addopts = "-v --tb=short --import-mode=importlib --strict-markers"

[tool.coverage.run]
# Branch coverage, not just statements. Measured at 92% across 22,524
# statements and 4,696 branches when this was enabled, against the 90%
# gate below -- the project already satisfied it, but nothing checked.
branch = true
source = ["src/mousedroid"]
omit = [
    "*/tests/*",
    "*/main.py",
    "*/hardware/sensors/ultrasonic.py",
    "*/hardware/camera/imx500.py",
    "*/hardware/lidar/ld19_driver.py",
    "*/arm/hardware/so_arm100_driver.py",
    "*/hardware/display/ssd1306_face_driver.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "^\\s*pass\\s*$",
    "^\\s*\\.\\.\\.\\s*$",
]
