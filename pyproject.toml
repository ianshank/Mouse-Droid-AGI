[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mousedroid"
version = "0.3.0"
description = "MouseDroidAGI — Star Wars MSE-6 Agentic World Model on Jetson Orin Nano"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "structlog>=23.0",
    "lmdb>=1.4",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "msgpack>=1.0",
    "networkx>=3.0",
    "faiss-cpu>=1.7",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
hardware = [
    "Jetson.GPIO>=2.1",
    "pyserial>=3.5",
    "picamera2>=0.3",
    "pyaudio>=0.2.13",
]
audio = [
    "pyaudio>=0.2.13",
]
voice = [
    "piper-tts>=1.2",
]
jetson = [
    "tensorrt>=8.0",
    "pycuda>=2022.1",
]
telemetry = [
    "aiohttp>=3.9",
    "zeroconf>=0.80",
]
llm = [
    "llama-cpp-python>=0.2",
    "huggingface-hub>=0.20",
]
arm = [
    "gymnasium>=0.29",
    "mujoco>=3.0",
    "stable-baselines3>=2.0",
    "pyperplan>=2.0",
    "ultralytics>=8.0",
    "scipy>=1.10",
]
hailo = [
    "hailort>=4.18",
]
lidar = [
    "pyserial>=3.5",
]
cfc = [
    "ncps>=0.0.7",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.80",
    "ruff>=0.4",
    "mypy>=1.5",
    "types-PyYAML>=6.0",
    "ncps>=0.0.7",
]

[project.scripts]
mousedroid = "mousedroid.main:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/mousedroid"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT",
    "S", "ANN", "D", "T20",
]
ignore = ["D100", "D104", "D107", "D203", "D213", "S101", "ANN401", "TCH", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101", "S108", "S603", "S607", "E402"]
"tools/**/*.py" = ["D", "ANN", "T20"]
"scripts/**/*.py" = ["D", "T20", "S603", "S104", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "mousedroid.config.schema",
    "mousedroid.llm_gateway.config",
    "mousedroid.world_model.encoder",
    "mousedroid.world_model.rssm",
    "mousedroid.world_model.mcts",
    "mousedroid.scaling.moe",
    "mousedroid.scaling.adaptive",
    "mousedroid.reward.model",
    "mousedroid.learning.progressive",
    "mousedroid.curiosity.icm",
    "mousedroid.growth.distillation",
    "mousedroid.arm.control.sac_agent",
    "mousedroid.arm.perception.object_detector",
    "mousedroid.arm.perception.depth_processor",
    "mousedroid.hardware.accelerator.hailo_runtime",
    "mousedroid.arm.perception.hailo_detector",
    "mousedroid.world_model.cfc_cell",
    "mousedroid.world_model.dual_stream_rssm",
    "mousedroid.world_model.stream_fusion",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# pydantic-settings BaseSettings + Field(default_factory=...) produces
# false-positive arg-type errors with mypy strict mode.
module = ["mousedroid.config.schema"]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "hardware: marks tests requiring real hardware",
    "smoke: marks smoke tests for end-to-end telemetry stack validation",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/mousedroid"]
omit = [
    "*/tests/*",
    "*/main.py",
    "*/hardware/sensors/ultrasonic.py",
    "*/hardware/camera/imx500.py",
    "*/hardware/lidar/ld19_driver.py",
    "*/arm/hardware/so_arm100_driver.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "pass",
    "\\.\\.\\.",
]
