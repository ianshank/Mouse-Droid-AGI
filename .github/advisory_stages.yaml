# Tracked advisory CI stages (F-020, WS-8.3).
#
# Every job in .github/workflows/*.yml carrying `continue-on-error: true`
# MUST have an entry here, or scripts/check_advisory_promotions.py WARNs
# ("untracked advisory stage"). When today - since > promote_after_days the
# checker WARNs "promotion overdue": either drop continue-on-error (promote
# to blocking) or extend the window here WITH a recorded reason.
#
# since:              date the stage landed advisory (YYYY-MM-DD)
# promote_after_days: green window before promotion is due
stages:
  - job: onnx-world-model-extras
    workflow: ci.yml
    since: 2026-05-16
    promote_after_days: 180
    reason: >-
      Landed PR #92 (Tier B2) with a 7-consecutive-green-run gate (not a
      calendar-day gate — see the promotion-status comment directly above
      the job in ci.yml, which itself needs a fresh count). Extended
      2026-08-16 after check_advisory_promotions.py flagged the original
      90-day window overdue: the real bar is the green-run count, and this
      pass could not cheaply re-derive the current streak from the Actions
      API without deep pagination. Next touch: count actual consecutive
      green runs for this specific job and either promote to blocking (drop
      continue-on-error, remove this entry) or re-extend with a verified
      count.
  # gitleaks: promoted advisory -> blocking 2026-08-07 (34 days advisory,
  # green across recent runs incl. runs where other jobs failed) - entry
  # removed because the tracker only covers jobs carrying continue-on-error.
  - job: vulture-audit
    workflow: ci.yml
    since: 2026-07-03
    promote_after_days: 90
    reason: >-
      F-020 dead-code audit is findings-only BY DESIGN (Protocol/DI false
      positives); the promotion decision at window end is "keep advisory
      forever + record an ADR" vs "strict mode on a curated allowlist".
  - job: performance
    workflow: ci.yml
    since: 2026-07-25
    promote_after_days: 90
    reason: >-
      Code-hygiene sprint: tests/performance previously ran in NO GitHub CI
      path. Latency budgets calibrated for the Jetson are noisy on shared
      runners (observed 1.17x vs a 1.15x budget from contention alone), so
      the tier lands advisory. Promotion decision at window end: make
      blocking if consistently green, or keep advisory + record the runner
      variance in an ADR.
  - job: security
    workflow: ci.yml
    since: 2026-07-25
    promote_after_days: 60
    reason: >-
      pip-audit was previously soft-failed via `|| echo ::warning::`, which
      hid it from this tracker entirely. Converted to continue-on-error so
      the promotion clock exists. Promotion requires triaging the current
      vulnerability findings (upstream-dependent) rather than a green
      window alone.
  - job: test-windows
    workflow: ci.yml
    since: 2026-08-20
    promote_after_days: 30
    reason: >-
      Windows cross-platform gate gates the 21 cross-platform fixes already
      landed and prevents regressions on the primary dev environment. Short
      promotion window — the fixes are well-tested locally; 30 consecutive
      green days in CI before promoting to blocking.
