# =============================================================================
# MouseDroidAGI -- PyPI Release Pipeline
# =============================================================================
# Triggers on version tag push (v*.*.*).
# Runs quality gates (lint, typecheck, test) matching CI patterns, then builds
# wheel + sdist and publishes to PyPI via trusted publishing (OIDC).
#
# Prerequisites:
#   1. Configure trusted publisher on PyPI for this GitHub repository.
#   2. Repository Settings -> Environments -> create "pypi" environment
#      with optional required-reviewers deployment protection rule.
# =============================================================================

name: Release to PyPI

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

env:
    MOUSEDROID_MOCK_HARDWARE: "true"
    MINIMUM_COVERAGE: "85"

jobs:
    # -------------------------------------------------------------------------
    # Stage 1: Lint (ruff check + format)
    # -------------------------------------------------------------------------
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install ruff
              run: pip install "ruff>=0.4"

            - name: Lint check
              run: ruff check src/ tests/

            - name: Format check
              run: ruff format --check src/ tests/

    # -------------------------------------------------------------------------
    # Stage 2: Type check (mypy --strict)
    # -------------------------------------------------------------------------
    typecheck:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: |
                  pip install -e ".[dev]"
                  pip install "typing_extensions>=4.0"

            - name: Type check
              run: mypy src/ --strict --ignore-missing-imports

    # -------------------------------------------------------------------------
    # Stage 3: Test + Coverage (85% gate)
    # -------------------------------------------------------------------------
    test:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev,telemetry]"

            - name: Run tests with coverage
              run: |
                  pytest tests/unit tests/property tests/integration \
                    -v --tb=short \
                    --cov=src/mousedroid \
                    --cov-report=term-missing \
                    --cov-fail-under=${{ env.MINIMUM_COVERAGE }} \
                    -x

    # -------------------------------------------------------------------------
    # Stage 4: Build sdist + wheel
    # -------------------------------------------------------------------------
    build:
        runs-on: ubuntu-latest
        needs: [typecheck, test]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install build tools
              run: pip install build

            - name: Verify tag matches package version
              run: |
                  TAG_VERSION="${GITHUB_REF#refs/tags/v}"
                  PKG_VERSION=$(python -c "
                  import tomllib
                  with open('pyproject.toml', 'rb') as f:
                      data = tomllib.load(f)
                  print(data['project']['version'])
                  ")
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($PKG_VERSION)"
                    exit 1
                  fi
                  echo "Version verified: $TAG_VERSION"

            - name: Build package
              run: python -m build

            - name: Verify build artifacts
              run: |
                  ls -lh dist/
                  python -m zipfile -l dist/*.whl | head -30

            - name: Upload build artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dist
                  path: dist/

    # -------------------------------------------------------------------------
    # Stage 5: Publish to PyPI (trusted publishing / OIDC)
    # -------------------------------------------------------------------------
    publish:
        runs-on: ubuntu-latest
        needs: build
        environment: pypi
        permissions:
            id-token: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dist
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
