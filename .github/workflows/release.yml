# =============================================================================
# MouseDroidAGI — PyPI Release Pipeline
# =============================================================================
# Trigger: push of version tags (v*.*.*).
# Jobs: quality-gate -> build -> publish (trusted publishing)
# =============================================================================

name: Release to PyPI

on:
    push:
        tags:
            - "v*.*.*"

env:
    MOUSEDROID_MOCK_HARDWARE: "true"
    MINIMUM_COVERAGE: "85"

jobs:
    # -------------------------------------------------------------------------
    # Stage 1: Quality gate (lint + typecheck + test)
    # -------------------------------------------------------------------------
    quality-gate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: |
                  pip install -e ".[dev,telemetry]"
                  pip install typing_extensions>=4.0

            - name: Lint check
              run: ruff check src/ tests/

            - name: Format check
              run: ruff format --check src/ tests/

            - name: Type check
              run: mypy --strict src/mousedroid/ --ignore-missing-imports

            - name: Run tests with coverage
              run: |
                  pytest tests/unit tests/property tests/integration \
                    -v --tb=short \
                    --cov=src/mousedroid \
                    --cov-report=term-missing \
                    --cov-fail-under=${{ env.MINIMUM_COVERAGE }} \
                    -x

    # -------------------------------------------------------------------------
    # Stage 2: Build sdist + wheel
    # -------------------------------------------------------------------------
    build:
        runs-on: ubuntu-latest
        needs: quality-gate
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install build tools
              run: pip install build

            - name: Build package
              run: python -m build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/

    # -------------------------------------------------------------------------
    # Stage 3: Publish to PyPI (trusted publishing)
    # -------------------------------------------------------------------------
    publish:
        runs-on: ubuntu-latest
        needs: build
        environment: pypi
        permissions:
            id-token: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
