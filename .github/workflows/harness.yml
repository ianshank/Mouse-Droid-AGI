# =============================================================================
# MouseDroid — Spec-Driven Harness Gate
# =============================================================================
# Enforces HARNESS_SPEC.md: validates features.yaml against features.schema.json,
# checks dependency-DAG integrity, verifies `implemented_in` resolves to a real
# git commit, and runs the validation_command of every `done` feature in the
# selected tier(s). A feature claiming `status: done` whose command does not
# pass fails the build. See docs/architecture/ADR-012-spec-driven-harness.md.
#
#   - validate-fast: every push + PR (fast tier; warn-only on git provenance)
#   - validate-slow: nightly schedule (fast + slow tiers; --strict-git)
#
# The `hardware` tier is intentionally absent — run it on the self-hosted Jetson
# runner: `python scripts/validate.py --tier hardware`.
# =============================================================================

name: Spec Harness

on:
    # Both triggers were previously unfiltered, so every push to every branch
    # fired this workflow twice — once for the push and once for the PR. Same
    # split as ci.yml: `push` on the trunk only, `pull_request` for the branch
    # patterns work actually lands on.
    push:
        branches: [main]
    pull_request:
        branches: [main, "feature/**", "claude/**", "refactor/**", "fix/**", "feat/**"]
    schedule:
        - cron: "0 7 * * *" # nightly: include the slow tier

concurrency:
    group: harness-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Validation commands delegate to pytest suites that import the hardware
    # drivers; mock them so the headless runner never touches real GPIO/serial
    # (mirrors scripts/ci.sh).
    MOUSEDROID_MOCK_HARDWARE: "true"

jobs:
    validate-fast:
        # Push/PR only: the nightly schedule runs validate-slow (fast+slow), so
        # gating here keeps the scheduled run from executing the fast tier twice.
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            # fetch-depth: 0 so `git rev-parse` can resolve implemented_in refs.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: pyproject.toml
            # The seeded validation_commands run real pytest suites, so install
            # the same extras as the ci.yml test job (not just pyyaml + jsonschema).
            - name: Install dev toolchain
              run: pip install -e ".[dev,telemetry,mcp]"
            - name: Validate harness (fast tier)
              run: python scripts/validate.py --tier fast

    validate-slow:
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: pyproject.toml
            - name: Install dev toolchain
              run: pip install -e ".[dev,telemetry,mcp]"
            # --strict-git: on main, every `done` feature's implemented_in must
            # resolve. Post-merge maintenance: replace branch-name refs (F-001,
            # F-003) with the squash/merge SHA so this stays green.
            - name: Validate harness (fast + slow tiers, strict git)
              run: python scripts/validate.py --tier fast,slow --strict-git
