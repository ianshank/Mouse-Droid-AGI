# =============================================================================
# MouseDroid — CI/CD Pipeline
# =============================================================================
# Staged quality gate: Lint → Typecheck → Test → Prometheus → Security → Docker
# (plus config/USB-C/extras/advisory jobs — count the jobs below rather than
# trusting a number here; this header once drifted to "6-stage" at 13 jobs).
# Runs on: push to main, pull requests
# Matrix: Python 3.10 + 3.11 + 3.12
# =============================================================================

name: CI

on:
    # Branch filters cover the active integration patterns:
    # * ``main`` and ``claude/**`` — the default branch family.
    # * ``feature/**`` — long-running feature integrations.
    # * ``refactor/**`` — multi-PR refactor staging branches (e.g.
    #   ``refactor/clock-protocol`` which fans into a stack of
    #   dependent PRs). Without this, PRs *targeting* a refactor
    #   branch never trigger CI — silent gap.
    # * ``fix/**`` and ``feat/**`` — short-lived staging branches used
    #   as bases for follow-up patches against the refactor branch
    #   (e.g. PR #81 against ``fix/orchestrator-...``). Mirrors the
    #   pattern above for consistency.
    push:
        branches: [main, "feature/**", "claude/**", "refactor/**", "fix/**", "feat/**"]
    pull_request:
        branches: [main, "feature/**", "claude/**", "refactor/**", "fix/**", "feat/**"]

env:
    MOUSEDROID_MOCK_HARDWARE: "true"
    MINIMUM_COVERAGE: "93"

jobs:
    # -------------------------------------------------------------------------
    # Stage 0: Workflow lint (actionlint)
    # Catches INVALID workflow files before they merge — e.g. an empty
    # ``${{ }}`` expression in a ``run:`` block (even inside a shell comment),
    # which makes GitHub reject the whole file and silently startup-fail every
    # run, disabling the gate. That exact bug left config-compat dead repo-wide
    # until PR #113; this job prevents the recurrence of the whole class.
    # -------------------------------------------------------------------------
    actionlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - name: Lint GitHub Actions workflows
              uses: docker://rhysd/actionlint:1.7.12
              with:
                  args: -color

    # -------------------------------------------------------------------------
    # Stage 1: Lint (ruff check + format)
    # -------------------------------------------------------------------------
    lint:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install ruff
              run: pip install "ruff==0.8.0"

            - name: Lint check
              run: ruff check src/ tests/ tools/

            - name: Format check
              run: ruff format --check src/ tests/ tools/

            - name: Lint scripts/
              run: ruff check scripts/

    # -------------------------------------------------------------------------
    # Stage 1b: Config overlay validation (Pydantic schema vs. config/*.yaml)
    # -------------------------------------------------------------------------
    config-validate:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install package (runtime only)
              run: pip install -e .

            - name: Validate every YAML overlay under config/
              run: python scripts/validate_configs.py --include-default

    # -------------------------------------------------------------------------
    # Stage 1c: USB-C smoke wiring regression
    # -------------------------------------------------------------------------
    usbc-config-gate:
        runs-on: ubuntu-latest
        needs: config-validate
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install package + test deps
              run: pip install -e ".[dev]"

            - name: USB-C discovery wiring assertion (jetson_production overlay)
              run: pytest tests/unit/test_jetson_production_overlay.py -q --no-cov

    # -------------------------------------------------------------------------
    # Stage 2: Type check (mypy --strict)
    # -------------------------------------------------------------------------
    typecheck:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies
              run: |
                  # telemetry extra brings aiohttp + Pillow so mypy sees the REAL
                  # types behind the optional-lib annotations in
                  # telemetry/{auth,server}.py and hardware/display/expressions.py.
                  # Without them --ignore-missing-imports degrades those to Any and
                  # strict mode flags untyped-decorator / valid-type errors.
                  pip install -e ".[dev,telemetry]"
                  pip install typing_extensions>=4.0

            - name: Type check
              run: mypy src/ --strict --ignore-missing-imports

    # -------------------------------------------------------------------------
    # Stage 3: Test + Coverage (85% gate)
    # -------------------------------------------------------------------------
    test:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev,telemetry,mcp]"

            # -m "not hardware" mirrors scripts/ci.sh (PR #160 rationale): tests
            # marked hardware open real GPIO/serial devices and must not collect
            # on a runner that does not own the peripherals.
            - name: Run tests with coverage
              run: |
                  pytest tests/unit tests/property tests/integration \
                    -m "not hardware" \
                    --import-mode=importlib \
                    -v --tb=short \
                    --cov=src/mousedroid \
                    --cov-report=term-missing \
                    --cov-fail-under=${{ env.MINIMUM_COVERAGE }} \
                    -x

            # Regression + E2E tiers are NOT coverage-gated (they mirror the
            # separate, no-coverage invocations in scripts/ci.sh) but MUST run in
            # CI — they hold the suppression-budget / numpy-hygiene / skill-output
            # contracts. The marker filter skips hardware (rover-only) and slow
            # (arm-extras) tests on the runner, which has no `[arm]` extras; the
            # arm e2e tests then `importorskip("mujoco")` and skip cleanly.
            - name: Run regression + e2e tiers
              run: |
                  pytest tests/regression tests/e2e \
                    -m "not hardware and not slow" \
                    --import-mode=importlib \
                    -v --tb=short --no-cov

            # The smoke tier is sub-10-seconds by construction (import + parse
            # sanity) and previously ran in NO CI path at all — a whole tier
            # could rot invisibly. Cheap enough to gate on.
            - name: Run smoke tier
              run: |
                  pytest tests/smoke \
                    -m "not hardware and not slow" \
                    --import-mode=importlib \
                    -v --tb=short --no-cov

            - name: Upload coverage
              if: matrix.python-version == '3.11'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report
                  path: .coverage

    # -------------------------------------------------------------------------
    # Stage 3b: Performance tier (ADVISORY — shared-runner timing is noisy)
    # -------------------------------------------------------------------------
    # tests/performance asserts latency/throughput budgets that are meaningful
    # on the Jetson but flaky on shared GitHub runners (a 1.15x overhead budget
    # was observed failing at 1.17x purely from runner contention). Advisory
    # per the house pattern: land continue-on-error, promote after a green
    # window. Tracked in .github/advisory_stages.yaml.
    performance:
        runs-on: ubuntu-latest
        needs: lint
        continue-on-error: true
        strategy:
            matrix:
                python-version: ["3.11"]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev,telemetry,mcp]"

            # The instrumentation-overhead budget (1.15x) is calibrated for
            # dedicated hardware; shared runners measured 1.17x-1.26x from
            # contention alone on every observed run, which would leave this
            # job perma-red and erode its signal. The test's own documented
            # env knob relaxes the budget on slower/shared hosts — 2.0x still
            # catches real instrumentation regressions (the failure mode is
            # order-of-magnitude, not percent-level).
            - name: Run performance tier (advisory)
              env:
                  MOUSEDROID_INSTRUMENTATION_OVERHEAD_BUDGET: "2.0"
              run: |
                  pytest tests/performance \
                    -m "not hardware" \
                    --import-mode=importlib \
                    -v --tb=short --no-cov

    # -------------------------------------------------------------------------
    # Stage 3c: Local-only gate parity (deterministic scripts/ci.sh stages)
    # -------------------------------------------------------------------------
    # These gates previously ran ONLY in `bash scripts/ci.sh` — a GitHub-CI-only
    # contributor bypassed all of them. This job runs the deterministic,
    # dependency-light subset. Still local-only by design (need a git diff base
    # or heavy deps): check_no_hardcoded_values.py, check_branch_coverage.py,
    # the pillar dispatch dry-run, and the --health-check.
    local-gates:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev,telemetry,mcp]"

            - name: Settings identity smoke check
              run: python scripts/check_settings_identity.py

            - name: Type check (workforce hooks)
              run: MYPYPATH=. mypy tools/claude_hooks/ --strict --ignore-missing-imports --explicit-package-bases

            - name: Skill validator (.claude/skills)
              run: python tools/validate_skill_commands.py

            - name: Doc hygiene (advisory, exits 0 unless --strict)
              run: python tools/doc_hygiene.py NEXT_STEPS.md

            - name: Workforce hook coverage (line gate + advisory branch)
              run: |
                  WORKFORCE_COV_MIN="$(python -c "from tools.claude_hooks.config import load_config; print(load_config().coverage.tools_line_min)")"
                  pytest tests/unit/tools/claude_hooks \
                    -m "not hardware" \
                    --import-mode=importlib \
                    -q -o addopts="" \
                    --cov=tools/claude_hooks --cov-branch --cov-report=term-missing \
                    --cov-fail-under="$WORKFORCE_COV_MIN"

    # -------------------------------------------------------------------------
    # Stage 4: Prometheus metrics validation
    # -------------------------------------------------------------------------
    prometheus-check:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev,telemetry,mcp]"

            - name: Install promtool (graceful skip if unavailable)
              id: promtool
              run: |
                  PROMTOOL_VERSION="2.51.0"
                  curl -sSLf "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz" \
                    -o prometheus.tar.gz && \
                  tar -xzf prometheus.tar.gz --strip-components=1 "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool" && \
                  chmod +x promtool && \
                  echo "available=true" >> "$GITHUB_OUTPUT" || \
                  echo "available=false" >> "$GITHUB_OUTPUT"

            - name: Validate Prometheus metrics format
              if: steps.promtool.outputs.available == 'true'
              run: |
                  # Generate metrics sample and validate with promtool
                  python -c "
                  import sys
                  try:
                      from mousedroid.telemetry.metrics import generate_metrics_sample
                      sample = generate_metrics_sample()
                      with open('metrics_sample.txt', 'w') as f:
                          f.write(sample)
                  except (ImportError, AttributeError):
                      # Module may not expose generate_metrics_sample — skip
                      sys.exit(0)
                  " && \
                  if [ -f metrics_sample.txt ] && [ -s metrics_sample.txt ]; then
                      # promtool exits 3 on lint warnings (naming conventions,
                      # e.g. abbreviated units in existing metric names). We
                      # keep the existing names for Grafana / alert-rule
                      # backwards compatibility, so warnings (rc=3) are
                      # non-fatal here; any other non-zero rc is still fatal.
                      set +e
                      ./promtool check metrics < metrics_sample.txt
                      rc=$?
                      set -e
                      if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
                          echo "promtool check metrics failed with rc=$rc"
                          exit "$rc"
                      fi
                      if [ "$rc" -eq 3 ]; then
                          echo "::notice::promtool check metrics returned lint warnings (rc=3) — treated as non-fatal for backwards compatibility"
                      fi
                  else
                      echo "No metrics sample generated — skipping validation"
                  fi

            - name: Validate Prometheus alert rules
              if: steps.promtool.outputs.available == 'true'
              run: ./promtool check rules config/prometheus/alerts.yml

            # ::warning:: (not a plain echo) so a silently-degraded job is
            # visible in the run summary — this job has no continue-on-error,
            # and without the annotation a promtool download failure made it
            # an invisible no-op that still showed green.
            - name: Skip notice
              if: steps.promtool.outputs.available != 'true'
              run: echo "::warning::promtool not available — Prometheus metrics validation was SKIPPED, not passed"

    # -------------------------------------------------------------------------
    # Stage 4b: VLA extras smoke — PROMOTED to required (Tier C3.1)
    # -------------------------------------------------------------------------
    # Catches ONNX Runtime API drift, HF-Hub pull regressions, and
    # provider-list changes that are invisible to the default test stage
    # (which only installs ``[dev,telemetry,mcp]``). Promoted from advisory
    # to required by Tier C3.1 after 6+ consecutive green runs against the
    # integration branch — the 7th green predates the matrix and doesn't
    # apply, so the gate was met by 6 in-matrix runs (run IDs documented
    # in the PR body / CHANGELOG).
    # The ``onnx-world-model-extras`` job below remains advisory until
    # IT accumulates its own 7 green runs (only 1 green so far — landed
    # with PR #92 on 2026-05-16).
    vla-extras:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                python-version: ["3.11"]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies (dev + vla extras)
              run: pip install -e ".[dev,vla]"

            - name: Run VLA-only test suite
              run: |
                  pytest tests/unit/vla \
                    -v --tb=short \
                    -m "not slow" \
                    --no-cov \
                    --import-mode=importlib

    # -------------------------------------------------------------------------
    # Stage 4b: Advisory CI matrix — [onnx_world_model] extras (Tier B2)
    # -------------------------------------------------------------------------
    # Catches ONNX Runtime API drift on the world-model export path
    # (which is invisible to the default test stage — it only installs
    # ``[dev,telemetry,mcp]``). Mirrors the ``vla-extras`` shape exactly,
    # including the 7-green-runs promotion gate from Tier B2 Story B2.6.
    #
    # PROMOTION STATUS: still advisory as of Tier C3.1. The job landed
    # with PR #92 (Tier B2) on 2026-05-16 — only 1 green run so far,
    # so this stays ``continue-on-error: true`` until 7 consecutive
    # green CI runs accumulate. Tier C2's PR will be the natural
    # promotion follow-up (by then the gate will have been met).
    onnx-world-model-extras:
        runs-on: ubuntu-latest
        needs: lint
        continue-on-error: true
        strategy:
            matrix:
                python-version: ["3.11"]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies (dev + onnx_world_model extras)
              run: pip install -e ".[dev,onnx_world_model]"

            - name: Run world-model ONNX test suite
              run: |
                  pytest tests/unit/world_model \
                         tests/unit/training/test_export_dual_stream_rssm_onnx.py \
                    -v --tb=short \
                    -m "not slow" \
                    --no-cov \
                    --import-mode=importlib

    # -------------------------------------------------------------------------
    # Stage 4c: Advisory secret scan — gitleaks (WS-0.4, F-015)
    # -------------------------------------------------------------------------
    # Full-history scan (fetch-depth 0) with the repo allowlist in
    # .gitleaks.toml — allowlisted by fake-key regex only, never by path.
    # The image is pinned to an exact patch tag (never "latest"), mirroring
    # the actionlint docker:// precedent above.
    #
    # PROMOTION STATUS: advisory since 2026-07-03 (landed with PR #151).
    # Stays continue-on-error: true until 7 consecutive green CI runs
    # accumulate, then drop the flag to make it blocking. Tracked in
    # .github/advisory_stages.yaml; runbook: docs/runbooks/secret-scanning.md.
    gitleaks:
        runs-on: ubuntu-latest
        needs: lint
        continue-on-error: true
        # Third-party tooling over a full checkout: least privilege, and no
        # persisted GITHUB_TOKEN on disk for later steps to read.
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Secret scan (gitleaks, advisory)
              uses: docker://zricethezav/gitleaks:v8.24.3
              with:
                  # The checkout is owned by the runner uid while the container
                  # runs as root — git inside the image refuses the workspace
                  # ("dubious ownership") unless it is marked safe first, so the
                  # entrypoint chains a safe.directory config before the scan.
                  entrypoint: sh
                  args: >-
                      -c "git config --global --add safe.directory /github/workspace
                      && gitleaks detect --source=. --config=.gitleaks.toml
                      --redact --no-banner --verbose"

    # -------------------------------------------------------------------------
    # Stage 4d: Advisory dead-code audit — vulture (WS-8.1, F-020)
    # -------------------------------------------------------------------------
    # Findings-only BY DESIGN: a Protocol/DI codebase produces false
    # positives by construction, so the audit reports (JSON artifact) and a
    # human disposes. Tracked in .github/advisory_stages.yaml.
    vulture-audit:
        runs-on: ubuntu-latest
        needs: lint
        continue-on-error: true
        # Same hardening rationale as the gitleaks job above.
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies (dev)
              run: pip install -e ".[dev]"

            - name: Dead-code audit (vulture, advisory)
              run: python scripts/dead_code_audit.py

            - name: Advisory promotion-lag check
              run: python scripts/check_advisory_promotions.py

            - name: Upload dead-code report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dead-code-report
                  path: reports/dead_code/
                  retention-days: 30
                  # The audit exits 0 without writing when vulture itself
                  # failed to install - don't fail the upload over it.
                  if-no-files-found: ignore

    # -------------------------------------------------------------------------
    # Stage 5: Security audit
    # -------------------------------------------------------------------------
    # Advisory via continue-on-error (tracked in .github/advisory_stages.yaml)
    # rather than the previous `|| echo ::warning::` swallow, which made the
    # job invisible to scripts/check_advisory_promotions.py — an advisory
    # stage with no promotion clock is a permanent soft gate.
    security:
        runs-on: ubuntu-latest
        needs: lint
        continue-on-error: true
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.11"
                  cache: pip

            # setuptools is upgraded first: it is the RUNNER's pre-installed
            # build tooling (the project builds with hatchling, not
            # setuptools), and the stale runner copy was the audit's first
            # real finding (PYSEC-2026-3447) once the job was un-swallowed.
            # Auditing it would report the runner image, not this project.
            - name: Install dependencies
              run: |
                  pip install --upgrade pip setuptools
                  pip install -e "." pip-audit

            # No --strict: the editable-installed mousedroid package is not on
            # PyPI, and --strict escalates even the --skip-editable skip itself
            # to a fatal error ("distribution marked as editable") — the job
            # failed on that (not on real findings) every run; the old
            # `|| echo` swallow just hid it. Without --strict, the local
            # package warns while real dependency vulnerabilities still exit
            # non-zero and trip this advisory job.
            - name: Security audit (advisory via continue-on-error)
              run: pip-audit --skip-editable

    # -------------------------------------------------------------------------
    # Stage 6: Docker build (Jetson — aarch64, build check only on x86)
    # -------------------------------------------------------------------------
    docker:
        runs-on: ubuntu-latest
        needs: [test, typecheck]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Validate Dockerfile
              # L4T base images (dustynv/l4t-pytorch, dustynv/llama_cpp) are
              # arm64-only. Docker's check mode reports InvalidBaseImagePlatform
              # warnings when validating that Jetson Dockerfile on the amd64 CI
              # runner and currently exits non-zero even though the Dockerfile
              # syntax and instructions are otherwise valid. Treat that specific
              # warning set as informational, but still fail on any other check
              # error or warning.
              run: |
                set +e
                docker build --check -f Dockerfile.jetson . > docker-check.log 2>&1
                rc=$?
                set -e
                cat docker-check.log
                if [ "$rc" -eq 0 ]; then
                  exit 0
                fi

                invalid_count=$(grep -c "WARNING: InvalidBaseImagePlatform" docker-check.log || true)
                warning_count=$(grep -c "^WARNING:" docker-check.log || true)
                if [ "$invalid_count" -gt 0 ] && [ "$warning_count" -eq "$invalid_count" ]; then
                  echo "::notice::Ignoring InvalidBaseImagePlatform warnings for arm64-only Jetson base images on the amd64 CI runner"
                  exit 0
                fi

                exit "$rc"

            - name: Syntax check docker-compose
              run: docker compose -f docker-compose.jetson.yml config --quiet
