# =============================================================================
# MouseDroidAGI — CI/CD Pipeline
# =============================================================================
# 6-stage quality gate: Lint → Typecheck → Test → Prometheus → Security → Docker
# Runs on: push to main, pull requests
# Matrix: Python 3.10 + 3.11 + 3.12
# =============================================================================

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    MOUSEDROID_MOCK_HARDWARE: "true"
    MINIMUM_COVERAGE: "85"

jobs:
    # -------------------------------------------------------------------------
    # Stage 1: Lint (ruff check + format)
    # -------------------------------------------------------------------------
    lint:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install ruff
              run: pip install "ruff>=0.4"

            - name: Lint check
              run: ruff check src/ tests/

            - name: Format check
              run: ruff format --check src/ tests/

    # -------------------------------------------------------------------------
    # Stage 2: Type check (mypy --strict)
    # -------------------------------------------------------------------------
    typecheck:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies
              run: |
                  pip install -e ".[dev]"
                  pip install typing_extensions>=4.0

            - name: Type check
              run: mypy src/ --strict --ignore-missing-imports

    # -------------------------------------------------------------------------
    # Stage 3: Test + Coverage (85% gate)
    # -------------------------------------------------------------------------
    test:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev,telemetry]"

            - name: Run tests with coverage
              run: |
                  pytest tests/unit tests/property tests/integration \
                    -v --tb=short \
                    --cov=src/mousedroid \
                    --cov-report=term-missing \
                    --cov-fail-under=${{ env.MINIMUM_COVERAGE }} \
                    -x

            - name: Upload coverage
              if: matrix.python-version == '3.11'
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: .coverage

    # -------------------------------------------------------------------------
    # Stage 4: Prometheus metrics validation
    # -------------------------------------------------------------------------
    prometheus-check:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev,telemetry]"

            - name: Install promtool (graceful skip if unavailable)
              id: promtool
              run: |
                  PROMTOOL_VERSION="2.51.0"
                  curl -sSLf "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz" \
                    -o prometheus.tar.gz && \
                  tar -xzf prometheus.tar.gz --strip-components=1 "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool" && \
                  chmod +x promtool && \
                  echo "available=true" >> "$GITHUB_OUTPUT" || \
                  echo "available=false" >> "$GITHUB_OUTPUT"

            - name: Validate Prometheus metrics format
              if: steps.promtool.outputs.available == 'true'
              run: |
                  # Generate metrics sample and validate with promtool
                  python -c "
                  import sys
                  try:
                      from mousedroid.telemetry.metrics import generate_metrics_sample
                      sample = generate_metrics_sample()
                      with open('metrics_sample.txt', 'w') as f:
                          f.write(sample)
                  except (ImportError, AttributeError):
                      # Module may not expose generate_metrics_sample — skip
                      sys.exit(0)
                  " && \
                  if [ -f metrics_sample.txt ] && [ -s metrics_sample.txt ]; then
                      ./promtool check metrics < metrics_sample.txt
                  else
                      echo "No metrics sample generated — skipping validation"
                  fi

            - name: Skip notice
              if: steps.promtool.outputs.available != 'true'
              run: echo "promtool not available — skipping Prometheus metrics validation"

    # -------------------------------------------------------------------------
    # Stage 5: Security audit
    # -------------------------------------------------------------------------
    security:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: pip install -e "." pip-audit

            - name: Security audit
              run: pip-audit --strict || true # Advisory — don't block on upstream vulns

    # -------------------------------------------------------------------------
    # Stage 6: Docker build (Jetson — aarch64, build check only on x86)
    # -------------------------------------------------------------------------
    docker:
        runs-on: ubuntu-latest
        needs: [test, typecheck]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Validate Dockerfile
              run: docker build --check -f Dockerfile.jetson .

            - name: Syntax check docker-compose
              run: docker compose -f docker-compose.jetson.yml config --quiet
