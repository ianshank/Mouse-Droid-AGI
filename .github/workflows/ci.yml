# =============================================================================
# MouseDroidAGI — CI/CD Pipeline
# =============================================================================
# 5-stage quality gate: Lint → Typecheck → Test → Security → Docker
# Runs on: push to main, pull requests
# Matrix: Python 3.10 + 3.11
# =============================================================================

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    MOUSEDROID_MOCK_HARDWARE: "true"

jobs:
    # -------------------------------------------------------------------------
    # Stage 1: Lint (ruff check + format)
    # -------------------------------------------------------------------------
    lint:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install ruff
              run: pip install "ruff>=0.4"

            - name: Lint check
              run: ruff check src/ tests/

            - name: Format check
              run: ruff format --check src/ tests/

    # -------------------------------------------------------------------------
    # Stage 2: Type check (mypy --strict)
    # -------------------------------------------------------------------------
    typecheck:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                python-version: ["3.10", "3.11"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies
              run: |
                  pip install -e ".[dev]"
                  pip install typing_extensions>=4.0

            - name: Type check
              run: mypy src/ --strict --ignore-missing-imports

    # -------------------------------------------------------------------------
    # Stage 3: Test + Coverage (85% gate)
    # -------------------------------------------------------------------------
    test:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                python-version: ["3.10", "3.11"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev]"

            - name: Run tests with coverage
              run: |
                  pytest tests/unit tests/property tests/integration \
                    -v --tb=short \
                    --cov=src/mousedroid \
                    --cov-report=term-missing \
                    --cov-fail-under=85 \
                    -x

            - name: Upload coverage
              if: matrix.python-version == '3.11'
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: .coverage

    # -------------------------------------------------------------------------
    # Stage 4: Security audit
    # -------------------------------------------------------------------------
    security:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: pip install -e "." pip-audit

            - name: Security audit
              run: pip-audit --strict || true # Advisory — don't block on upstream vulns

    # -------------------------------------------------------------------------
    # Stage 5: Docker build (Jetson — aarch64, build check only on x86)
    # -------------------------------------------------------------------------
    docker:
        runs-on: ubuntu-latest
        needs: [test, typecheck]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Validate Dockerfile
              run: docker build --check -f Dockerfile.jetson .

            - name: Syntax check docker-compose
              run: docker compose -f docker-compose.jetson.yml config --quiet
