# =============================================================================
# MouseDroidAGI — Config Schema Compatibility Gate
# =============================================================================
# Detects PRs that change config/*.yaml in ways the currently-deployed
# Jetson container image's schema cannot accept. Catches the silent-drift
# class of failures where a yaml-only PR merges, the rover pulls main,
# and the container crash-loops with `Extra inputs are not permitted`.
#
# Triggers only when config YAML changes; skipped otherwise.
# Source of truth for the deployed image SHA: deployments/<platform>-image.json
# =============================================================================

name: Config Schema Compat

on:
    pull_request:
        paths:
            - "config/**/*.yaml"
            - "config/**/*.yml"
            - "deployments/*.json"
            - "scripts/check_config_compat.py"
            - ".github/workflows/config-compat.yml"

permissions:
    contents: read

jobs:
    config-compat:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Add more platforms here as additional deployment records
                # are added under deployments/.
                platform: [jetson]
        steps:
            - name: Checkout PR head with full history
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  # The script worktrees out the deployed SHA, so we need
                  # the full history available locally.
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install runtime deps (for schema loading)
              run: |
                  pip install -e ".[dev]"

            - name: Determine changed YAML files
              id: changed
              run: |
                  # PR base branch SHA → HEAD SHA diff
                  base="${{ github.event.pull_request.base.sha }}"
                  files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'config/*.yaml' 'config/**/*.yaml' || true)
                  # Join with spaces (not newlines): a multiline output
                  # templated through a GitHub Actions expression into a shell
                  # command splits at the newline and tries to execute the
                  # second file as a command — exit 126 "permission denied" on
                  # the YAML path. The downstream script accepts a
                  # space-separated whitespace list.
                  # NOTE: do not write a literal GitHub expression token in this
                  # run block (even in a comment) — the parser evaluates it and
                  # an empty one is an "invalid workflow file" startup failure.
                  files_one_line=$(printf '%s' "$files" | tr '\n' ' ')
                  echo "files=$files_one_line" >> "$GITHUB_OUTPUT"
                  if [ -z "$files" ]; then
                      echo "no_config_changes=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "no_config_changes=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Skip when no config YAML changed
              if: steps.changed.outputs.no_config_changes == 'true'
              run: echo "No config YAML changes; gate skipped."

            - name: Run schema compatibility check
              if: steps.changed.outputs.no_config_changes != 'true'
              run: |
                  # Pass changed files explicitly so the script does not
                  # need to re-derive the diff inside the runner.
                  # ``files`` is a space-separated single-line list from
                  # the previous step; word-splitting is intentional so
                  # each path becomes its own argument.
                  # shellcheck disable=SC2086
                  python scripts/check_config_compat.py \
                      --platform "${{ matrix.platform }}" \
                      --changed-files ${{ steps.changed.outputs.files }}
