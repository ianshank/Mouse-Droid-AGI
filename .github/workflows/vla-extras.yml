# =============================================================================
# MouseDroidAGI — [vla] extras matrix (advisory)
# =============================================================================
# PR-A2 (per docs/planning/PHASE_2_1_AND_BEYOND_PLAN.md): install the optional
# ``[vla]`` extra (onnxruntime, etc.) and run the VLA unit-test slice. Without
# this job, ORT API drift / provider-list / HF-pull regressions in
# src/mousedroid/vla/ are invisible until somebody manually runs ``pip install
# -e ".[dev,vla]"``.
#
# Advisory mode (``continue-on-error: true``) for the first merge cycle so a
# flaky onnxruntime install doesn't block trunk; promote to required after one
# green merge cycle.
#
# Py3.11 only — onnxruntime extras pin >=1.18; py3.10 wheel availability is
# spotty on ubuntu-latest, py3.12 already covered by the main matrix on the
# slow-running marker filter.
# =============================================================================

name: VLA extras

on:
    push:
        branches: [main, "feature/**", "claude/**", "refactor/**", "fix/**", "feat/**"]
    pull_request:
        branches: [main, "feature/**", "claude/**", "refactor/**", "fix/**", "feat/**"]

env:
    MOUSEDROID_MOCK_HARDWARE: "true"

jobs:
    vla-extras:
        runs-on: ubuntu-latest
        # Advisory only for the first merge cycle; do not block trunk on a
        # flaky onnxruntime install. Flip to ``continue-on-error: false`` after
        # one green merge cycle (see PHASE_2_1_AND_BEYOND_PLAN.md A2).
        continue-on-error: true
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install package with [dev,vla] extras
              run: pip install -e ".[dev,vla]"

            - name: Run VLA unit-test slice (fast tests only)
              run: pytest tests/unit/vla -m "not slow" --no-cov -v --tb=short
