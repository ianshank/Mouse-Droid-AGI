# Promtail configuration — Docker log collection for MouseDroidAGI
#
# Collects Docker container logs from the Jetson Orin Nano and
# ships them to Loki.  MouseDroid emits structlog JSON, so the
# pipeline extracts structured fields for label enrichment.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Keep only containers with com.docker.compose.service label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      # MouseDroid uses structlog JSON output
      - json:
          expressions:
            level: level
            event: event
            module: logger
            timestamp: timestamp
      - labels:
          level:
          event:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.000Z"
            - UnixMs
      # Drop noisy debug lines in production
      - match:
          selector: '{level="debug"}'
          action: drop
          drop_counter_reason: debug_noise
