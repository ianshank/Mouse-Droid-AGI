# Promtail configuration -- MouseDroidAGI log collection
#
# Collects logs from two sources on the Jetson Orin Nano:
# 1. systemd journal (mousedroid.service unit)
# 2. File-based logs (/var/log/mousedroid/*.log)
#
# MouseDroid emits structlog JSON, so the pipeline extracts structured
# fields for label enrichment in Loki.
#
# ---------------------------------------------------------------
# Useful LogQL queries for debugging (paste into Grafana Explore):
#
#   Emergency stops:
#     {job="mousedroid"} |= "emergency_stop"
#
#   Constitutional / safety violations:
#     {job="mousedroid"} |= "safety_violation" or {job="mousedroid"} |= "constitutional"
#     {job="mousedroid"} | json | event=~"safety_violation.*|constitutional_violation.*"
#
#   Sensor failures / stale readings:
#     {job="mousedroid"} |= "sensor_stale" or {job="mousedroid"} |= "sensor_error"
#     {job="mousedroid"} | json | event=~"sensor_.*_error|sensor_stale.*"
#
#   CfC (Closed-form Continuous-time) fallback events:
#     {job="mousedroid"} |= "cfc_fallback" or {job="mousedroid"} |= "cfc_error"
#     {job="mousedroid"} | json | event=~"cfc_fallback.*|cfc_timeout.*"
#
#   Loop latency spikes:
#     {job="mousedroid"} | json | loop_time_ms > 200
#
#   Battery warnings:
#     {job="mousedroid"} |= "battery" | json | level="warning"
#
#   All errors and critical events:
#     {job="mousedroid"} | json | level=~"error|critical"
#
#   --- PR-A2 telemetry events ---
#
#   Phase 2.1 BC training activations (one-shot per training run):
#     {job="mousedroid"} |= "offline_rl_bc_active"
#
#   Replay-record schema-mismatch drops (LMDB corruption / schema drift):
#     {job="mousedroid"} | json | event=~"replay_schema_mismatch.*"
#     # Correlate spikes with the mousedroid_replay_records_total
#     # {outcome="schema_mismatch"} Prometheus counter.
#
#   Sim/real ReplayMixer activation events (per training run):
#     {job="mousedroid"} |= "offline_rl_mixer_active"
#     {job="mousedroid"} |= "offline_rl_mixer_requested_but_unavailable"
#
#   VLA inference latency drops (clock-skew / NaN samples rejected):
#     {job="mousedroid"} | json | event="vla_inference_seconds_dropped"
#     # Field "reason" tells you nan vs negative; field "value" carries the
#     # offending sample. Spikes here correlate with missing histogram
#     # observations in mousedroid_vla_inference_seconds_count.
#
#   --- Ten-Pillars campaign (PR-B2) ---
#
#   Pillar test pass/fail breadcrumbs (run via scripts/validate_pillar.sh):
#     {job="mousedroid"} |= "pillar_validation"
# ---------------------------------------------------------------

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Persistent path — survives reboots so promtail doesn't re-ingest old logs.
  # Ensure directory exists with correct permissions in deployment:
  #   mkdir -p /var/lib/promtail && chown promtail:promtail /var/lib/promtail
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ------------------------------------------------------------------
  # Source 1: systemd journal (mousedroid.service)
  # ------------------------------------------------------------------
  - job_name: mousedroid-journal
    journal:
      json: false
      max_age: 12h
      labels:
        job: mousedroid
      path: /var/log/journal
    relabel_configs:
      # Only keep logs from the mousedroid systemd unit
      - source_labels: ["__journal__systemd_unit"]
        regex: "mousedroid\\.service"
        action: keep
      # Enrich with hostname for multi-node deployments
      - source_labels: ["__journal__hostname"]
        target_label: instance
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
    pipeline_stages:
      # MouseDroid uses structlog JSON output
      - json:
          expressions:
            level: level
            event: event
            module: logger
            timestamp: timestamp
      - labels:
          level:
          event:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.000Z"
            - UnixMs
      # Drop noisy debug lines in production
      - match:
          selector: '{level="debug"}'
          action: drop
          drop_counter_reason: debug_noise

  # ------------------------------------------------------------------
  # Source 2: file-based logs (/var/log/mousedroid/*.log)
  # ------------------------------------------------------------------
  - job_name: mousedroid-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: mousedroid
          source: file
          instance: "{{.Host}}"
          __path__: /var/log/mousedroid/*.log
    pipeline_stages:
      # MouseDroid uses structlog JSON output
      - json:
          expressions:
            level: level
            event: event
            module: logger
            timestamp: timestamp
      - labels:
          level:
          event:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.000Z"
            - UnixMs
      # Drop noisy debug lines in production
      - match:
          selector: '{level="debug"}'
          action: drop
          drop_counter_reason: debug_noise

  # ------------------------------------------------------------------
  # Source 3: Docker container logs (optional, for Docker deployments)
  # ------------------------------------------------------------------
  - job_name: mousedroid-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Keep only containers with com.docker.compose.service label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: /(.*)
        target_label: container
      # Enrich with hostname
      - source_labels: []
        target_label: instance
        replacement: "{{.Host}}"
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            module: logger
            timestamp: timestamp
      - labels:
          level:
          event:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.000Z"
            - UnixMs
      - match:
          selector: '{level="debug"}'
          action: drop
          drop_counter_reason: debug_noise
