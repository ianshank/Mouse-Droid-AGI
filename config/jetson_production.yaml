platform: mouse_droid
mock_hardware: false
debug: false

jetson:
  tensorrt_enabled: true
  gpu_memory_fraction: 0.7
  power_mode: "15W"
  dla_enabled: false
  precision: "fp16"
  workspace_gb: 2.0

logging:
  level: "INFO"
  format: "json"

experience:
  path: "/home/jetson/mousedroid_experience"
  map_size_gb: 40
  flush_every_n: 60

llm_gateway:
  model_path: "/home/jetson/models/Phi-3-mini-4k-instruct-q4.gguf"
  n_threads: 4
  n_gpu_layers: -1
  max_tokens: 256
  temperature: 0.1
