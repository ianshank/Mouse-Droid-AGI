platform: mouse_droid
mock_hardware: false
debug: false

safety:
  min_valid_sensors: 1
  battery_critical_v: 0.0
  battery_warn_v: 0.0
  max_loop_time_ms: 200.0

# Fast-fail retry: no multi-second backoff in the 30 Hz loop
retry:
  max_attempts: 1
  base_delay_s: 0.05

jetson:
  tensorrt_enabled: true
  gpu_memory_fraction: 0.7
  power_mode: "15W"
  dla_enabled: false
  precision: "fp16"
  workspace_gb: 2.0

llm:
  enabled: true
  model_path: "/opt/mousedroid/models/Phi-3-mini-4k-instruct-q4.gguf"
  context_length: 2048
  n_threads: 6
  n_gpu_layers: -1
  max_tokens: 128
  temperature: 0.1
  latency_target_ms: 500.0

microphone:
  enabled: true
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  device_name: "USB"
  format: "float32"
  n_mels: 64
  n_fft: 512
  hop_length: 256

speaker:
  enabled: true
  sample_rate: 22050
  channels: 1
  chunk_size: 1024
  device_name: "USB"  # Wonrabai USB Sound Card (shared with microphone)
  format: "float32"

lidar:
  enabled: true
  serial_port: "/dev/ttyUSB1"
  baud_rate: 230400
  n_sectors: 36

camera:
  # Arducam IMX708 dual via Jetson CSI (nvarguscamerasrc / libargus).
  # DT overlay: tegra234-p3767-camera-p3768-imx708-dual.dtbo.
  backend: "jetson_csi"
  resolution_width: 1280
  resolution_height: 720
  fps: 30
  use_onboard_inference: false  # IMX708 has no onboard NPU
  feature_extractor: "mean_pool"  # switch to "tensorrt"/"hailo" once weights are staged

voice:
  enabled: true
  cooldown_s: 5.0
  personality: "rocky"
  tts_sample_rate: 22050
  queue_size: 16

logging:
  level: "INFO"
  format: "json"

cognitive:
  enabled: true
  weights_dir: "/opt/mousedroid/weights/bdi"
  huggingface_repo: "ianshank/mousedroid-weights"
  auto_download: true
  fallback_to_mcts: true
  download_max_retries: 5
  download_backoff_base: 2.0

metrics:
  enabled: true
  path: "/metrics"
  namespace: "mousedroid"

telemetry:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  publish_hz: 10.0
  max_clients: 10
  serialization: "json"
  mdns_enabled: true
  mdns_service_name: "MouseDroid Telemetry"
  auth:
    auth_enabled: true
    token_env_var: "MOUSEDROID_TELEMETRY_TOKEN"
    allowed_origins: []
    exempt_paths: ["/health", "/metrics", "/api/v1/health"]

experience:
  path: "/home/jetson/mousedroid_experience"
  map_size_gb: 40
  flush_every_n: 60

# Hailo-8 neural accelerator (uncomment to enable)
