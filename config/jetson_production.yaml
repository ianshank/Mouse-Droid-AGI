platform: mouse_droid
mock_hardware: false
debug: false

safety:
  min_valid_sensors: 1
  # Battery monitoring is DISABLED on this rig because the Orin Nano
  # developer kit has no onboard battery voltage sensor and the ESP32 does
  # not report a reliable voltage over the existing serial protocol. Leaving
  # these at 0.0 honours the schema's documented "0 disables" semantic.
  # When a battery ADC is wired up, override these to the hardware
  # thresholds (schema defaults are 10.5V warn / 9.5V critical).
  battery_critical_v: 0.0
  battery_warn_v: 0.0
  max_loop_time_ms: 200.0

# Fast-fail retry: no multi-second backoff in the 30 Hz loop
retry:
  max_attempts: 1
  base_delay_s: 0.05

esp32:
  serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_cc0ff02aab6cef119a38a4adc169b110-if00-port0"
  serial_baud: 1000000

jetson:
  tensorrt_enabled: true
  gpu_memory_fraction: 0.7
  power_mode: "15W"
  dla_enabled: false
  precision: "fp16"
  workspace_gb: 2.0

# Production overlay tightens DR ranges — production deployments do not
# train, but if a Jetson is used for occasional fine-tuning we keep the
# noise envelope conservative.
domain_randomization:
  brightness: {low: 0.85, high: 1.15}
  contrast: {low: 0.9, high: 1.1}
  gaussian_noise_std: {low: 0.0, high: 0.015}
  ultrasonic_noise_m: {low: 0.0, high: 0.015}
  ultrasonic_dropout_prob: {low: 0.0, high: 0.02}
  wheel_friction: {low: 0.9, high: 1.1}
  wheel_slip: {low: 0.0, high: 0.05}
  motor_gain: {low: 0.95, high: 1.05}
  uart_latency_ms: {low: 2.0, high: 8.0}
  encoder_dropout_prob: {low: 0.0, high: 0.005}
  push_force_n: {low: 0.0, high: 0.5}
  push_event_prob: 0.01
  feature_noise_std: {low: 0.0, high: 0.005}

llm:
  enabled: true

  # --- Primary tier: Claude (Anthropic) — deliberative mission translation ---
  # PR #107. Cloud Claude translates NL missions -> GoalVector OUTSIDE the 30 Hz
  # hot loop; the deterministic RSSM->MCTS->ESP32 path is unchanged.
  backend: "anthropic"
  # No model id is hardcoded in the gateway. Haiku = lowest-latency on-rover
  # default for short velocity-goal translations; switch to a Sonnet id for
  # harder multi-step mission language.
  model_name: "claude-haiku-4-5"
  # api_key intentionally absent here — supply via ANTHROPIC_API_KEY or
  # MOUSEDROID_LLM__API_KEY in /etc/mousedroid/docker.env (SecretStr; never YAML).
  request_timeout_s: 20.0
  # Cloud round-trips are 1-5 s; the 500 ms local default would spam
  # anthropic_gateway_slow WARNINGs (code-reviewer PR #107 finding 3).
  latency_target_ms: 5000.0

  # --- Off-network fallback tier: local Phi-3-mini via llama_cpp ---
  # When api.anthropic.com is unreachable, the composite serves locally so the
  # rover stays autonomous. llama_cpp loads model_path (below) and ignores
  # model_name, so no fallback_model_name override is needed.
  fallback_backend: "llama_cpp"
  fallback_retry_cooldown_s: 30.0

  # --- Local-tier knobs (RETAINED verbatim — drive the llama_cpp fallback) ---
  model_path: "/opt/mousedroid/models/Phi-3-mini-4k-instruct-q4.gguf"
  context_length: 2048
  n_threads: 6
  # F-006: -1 offloads every layer to the iGPU so matmul stays on CUDA instead
  # of CPU (where Phi-3-mini-q4 runs at ~0.5 tok/s, blowing latency_target_ms).
  # Override per-host via MOUSEDROID_LLM__N_GPU_LAYERS=<int> in
  # /etc/mousedroid/docker.env (e.g. =0 on a CPU-only fallback host).
  n_gpu_layers: -1
  n_batch: 32
  max_tokens: 128
  temperature: 0.1

microphone:
  enabled: true
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  device_name: "USB"
  format: "float32"
  n_mels: 64
  n_fft: 512
  hop_length: 256

speaker:
  enabled: true
  sample_rate: 22050
  channels: 1
  chunk_size: 1024
  device_name: "USB"  # Wonrabai USB Sound Card (shared with microphone)
  format: "float32"

lidar:
  enabled: true
  serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
  baud_rate: 230400
  scan_acquisition_timeout_s: 1.0
  n_sectors: 36

# USB-C smoke gate — globs intentionally reuse the existing by-id paths so
# changing the serial_port above propagates to discovery automatically. Plan:
# docs/superpowers/plans/2026-05-30-jetson-rover-usbc-smoke-validation.md
usbc_discovery:
  enabled: true
  by_id_root: "/dev/serial/by-id"
  required_endpoints:
    - name: rover_esp32
      by_id_glob: "usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_*-if00-port0"
      required: true
    - name: lidar_ld19
      by_id_glob: "usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_*-if00-port0"
      required: true

camera:
  # Arducam IMX708 dual via Jetson CSI (nvarguscamerasrc / libargus).
  # DT overlay: tegra234-p3767-camera-p3768-imx708-dual.dtbo.
  backend: "jetson_csi"
  resolution_width: 1280
  resolution_height: 720
  fps: 30
  use_onboard_inference: false  # IMX708 has no onboard NPU
  feature_extractor: "mean_pool"  # switch to "tensorrt"/"hailo" once weights are staged

voice:
  enabled: true
  cooldown_s: 5.0
  personality: "rocky"
  # Piper voice model staged inside the container image at build time.
  # Path lives outside /opt/mousedroid because that directory is bind-mounted
  # from the host in docker-compose.jetson.yml and would mask image-baked files.
  tts_model_path: "/opt/voice_models/en_US-lessac-medium.onnx"
  personality_to_model_map:
    rocky: "/opt/voice_models/en_US-lessac-medium.onnx"
    scout: "/opt/voice_models/en_GB-alba-medium.onnx"
    friendly: "/opt/voice_models/en_US-amy-medium.onnx"
  tts_sample_rate: 22050
  output_volume: 1.0
  queue_size: 16
  event_intensity_thresholds:
    obstacle_detected: 0.55
    error: 0.45
    low_battery: 0.6
    emergency_stop: 0.0

logging:
  level: "INFO"
  format: "json"

cognitive:
  enabled: true
  weights_dir: "/opt/mousedroid/weights/bdi"
  huggingface_repo: "ianshank/mousedroid-weights"
  auto_download: true
  fallback_to_mcts: true
  download_max_retries: 5
  download_backoff_base: 2.0

metrics:
  enabled: true
  path: "/metrics"
  namespace: "mousedroid"

telemetry:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  publish_hz: 10.0
  max_clients: 10
  serialization: "json"
  mdns_enabled: true
  mdns_service_name: "MouseDroid Telemetry"
  # PR #4 — live streaming + frame liveness defaults. Override here if
  # the deployment needs a different cadence or namespace.
  lidar_raw_publish_hz: 5.0          # raw 360° scan WS rate (Hz)
  lidar_raw_queue_size: 16           # raw-scan queue depth (drops if full)
  lidar_raw_ws_path: "/ws/v1/lidar/raw"
  ws_protocol_version: 1
  ws_handshake_timeout_s: 2.0
  msgpack_client_lib_url: "https://github.com/msgpack/msgpack-javascript"
  sensor_liveness_stale_s: 2.0       # age (s) above which sensors flip to "stale"
  mdns_register_timeout_s: 5.0       # max wait for Zeroconf register during start()
  # Mock-mode flags (production keeps both at defaults; explicit for clarity).
  # Set ``mock_force_real_when_enabled: false`` to restore the legacy
  # MockTelemetryServer in mock_hardware mode (tests-only escape hatch).
  mock_force_real_when_enabled: true
  mock_telemetry_source_enabled: true
  auth:
    auth_enabled: true
    token_env_var: "MOUSEDROID_TELEMETRY_TOKEN"
    allowed_origins: []
    exempt_paths: ["/health", "/metrics", "/api/v1/health"]

experience:
  path: "/home/jetson/mousedroid_experience"
  map_size_gb: 40
  flush_every_n: 60

# Phase 2 real-episode replay loop (PR #60).
#
# Defaults are inert (`alpha_target: 0.0` = sim-only) so the rover keeps the
# pre-Phase-2 byte-identical training behaviour until an operator opts in.
# To start drawing real episodes into PPO's BC-aux loss, ramp `alpha_target`
# in a follow-up PR (suggested first step: 0.05 over 1000 ramp steps).
#
# `debug_log_every_n` is the live-triage knob: set to e.g. 100 to surface
# `mixer_draw` and `replay_chunk_decoded` DEBUG lines without flooding
# the journal. Default 0 keeps debug logs off.
training:
  replay_mixer:
    alpha_target: 0.0
    alpha_ramp_steps: 1000
    chunk_size: 64
    seed: null
    log_every_n: 500
    debug_log_every_n: 0

# MSE-6 SSD1306 OLED face display (PR #45).
# Wiring on Jetson Orin Nano 40-pin header:
#   VCC -> pin 1 (3.3V)   GND -> pin 6
#   SDA -> pin 3 (I2C1_SDA -> /dev/i2c-7)
#   SCL -> pin 5 (I2C1_SCL -> /dev/i2c-7)
# Verify with: sudo i2cdetect -y -r 7  (expect 0x3C)
# All thresholds intentionally left at schema defaults so we inherit
# upstream tuning without duplicating magic numbers here.
face_display:
  enabled: true
  i2c_bus: 7
  i2c_address: 0x3C
  width: 128
  height: 64
  refresh_hz: 10.0
  boot_message: "MSE-6 online"
  idle_blink_interval_s: 4.0
  blink_close_duration_s: 0.15
  min_dwell_s: 0.6
  fallback_to_mock_on_error: true

# Hailo-8 neural accelerator (uncomment to enable)
# hailo:
#   enabled: true
#   device_path: "/dev/hailo0"
#   yolo_hef_path: "/opt/mousedroid/models/hailo/yolo11_disk_detector.hef"
#   feature_extractor_hef_path: "/opt/mousedroid/models/hailo/feature_extractor.hef"
#   power_mode: "performance"
#   fallback_on_failure: true

# Watchdog — emits a file-based liveness heartbeat that the Docker
# HEALTHCHECK reads. The orchestrator calls watchdog.notify() after every
# successful tick; if the loop hangs, the file goes stale and the
# container flips to unhealthy. See scripts/mousedroid_healthcheck.sh
# for the stat-based recency probe and
# src/mousedroid/health/watchdog.py for the FileHeartbeatNotifier
# implementation. Staleness threshold is derived as
# `watchdog_interval_s * watchdog_tolerance_factor` in
# `mousedroid.health.healthcheck_env.derive_healthcheck_env`.
loop:
  watchdog_enabled: true
  watchdog_mode: "file"
  watchdog_interval_s: 10.0
  watchdog_heartbeat_path: "/tmp/mousedroid_heartbeat"
  watchdog_tolerance_factor: 3.0
  start_grace_s: 60.0
  start_grace_file: "/run/mousedroid.start"
