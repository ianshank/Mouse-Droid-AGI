platform: mouse_droid
mock_hardware: false
debug: false

safety:
  min_valid_sensors: 1
  battery_critical_v: 9.5

jetson:
  tensorrt_enabled: true
  gpu_memory_fraction: 0.7
  power_mode: "15W"
  dla_enabled: false
  precision: "fp16"
  workspace_gb: 2.0

llm:
  enabled: true
  model_path: "/opt/mousedroid/models/llama-3-8b-instruct.Q4_K_M.gguf"
  context_length: 2048
  n_threads: 6
  n_gpu_layers: -1
  max_tokens: 128
  temperature: 0.1
  latency_target_ms: 500.0

logging:
  level: "INFO"
  format: "json"

cognitive:
  enabled: true
  weights_dir: "/opt/mousedroid/weights/bdi"
  huggingface_repo: "ianshank/mousedroid-weights"
  auto_download: true
  fallback_to_mcts: true
  download_max_retries: 5
  download_backoff_base: 2.0

metrics:
  enabled: true
  path: "/metrics"
  namespace: "mousedroid"

telemetry:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  publish_hz: 10.0
  max_clients: 10
  serialization: "json"
  mdns_enabled: true
  mdns_service_name: "MouseDroid Telemetry"
  auth:
    auth_enabled: true
    token_env_var: "MOUSEDROID_TELEMETRY_TOKEN"
    allowed_origins: []
    exempt_paths: ["/health", "/metrics"]

experience:
  path: "/home/jetson/mousedroid_experience"
  map_size_gb: 40
  flush_every_n: 60
