# Prometheus scrape config -- Docker monitoring stack scraping the host-published
# MouseDroid telemetry endpoint.
#
# Use with docker-compose.monitoring.yml when MouseDroid itself is running via
# docker-compose.jetson.yml with network_mode: host. Prometheus reaches the
# telemetry endpoint through Docker's host-gateway alias.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mousedroid
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /metrics
    honor_labels: true
    # Uncomment to enable bearer token auth (matches TelemetryAuthConfig):
    # bearer_token_file: /etc/prometheus/mousedroid_token
    static_configs:
      - targets:
          - "host.docker.internal:8080"
        labels:
          env: monitoring
          platform: jetson

  - job_name: node
    scrape_interval: 15s
    honor_labels: true
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          env: monitoring

rule_files:
  - /etc/prometheus/alerts.yml