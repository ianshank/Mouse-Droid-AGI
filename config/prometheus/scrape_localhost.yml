# Prometheus scrape config -- localhost development
#
# Use when running MouseDroid directly on the host (no Docker).
# Default telemetry port: TelemetryConfig.port = 8080
# Metrics path: MetricsConfig.path = /metrics
#
# Authentication: If TelemetryConfig.auth is configured with bearer token
# auth, uncomment the bearer_token_file line and place the token in the
# referenced file.

scrape_configs:
  - job_name: mousedroid
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /metrics
    honor_labels: true
    # Uncomment to enable bearer token auth (matches TelemetryAuthConfig):
    # bearer_token_file: /etc/prometheus/mousedroid_token
    static_configs:
      - targets:
          - "localhost:8080"
        labels:
          env: dev
          platform: jetson

  # Optional: node_exporter for host-level metrics (memory, CPU, disk)
  - job_name: node
    scrape_interval: 15s
    honor_labels: true
    static_configs:
      - targets:
          - "localhost:9100"
        labels:
          env: dev

rule_files:
  - alerts.yml
