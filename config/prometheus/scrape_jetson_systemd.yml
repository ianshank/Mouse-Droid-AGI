# Prometheus scrape config -- Jetson Orin Nano with systemd service
#
# Use when mousedroid runs as a systemd unit on the Jetson Orin Nano.
# Default telemetry port: TelemetryConfig.port = 8080
# Metrics path: MetricsConfig.path = /metrics
# Jetson default IP over USB: 192.168.55.1
#
# Authentication: If TelemetryConfig.auth is configured with bearer token
# auth, uncomment the bearer_token_file line and place the token in the
# referenced file on the Prometheus host.

scrape_configs:
  - job_name: mousedroid
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /metrics
    honor_labels: true
    # Uncomment to enable bearer token auth (matches TelemetryAuthConfig):
    # bearer_token_file: /etc/prometheus/mousedroid_token
    static_configs:
      - targets:
          - "192.168.55.1:8080"
        labels:
          env: production
          platform: jetson

  - job_name: node
    scrape_interval: 15s
    honor_labels: true
    static_configs:
      - targets:
          - "192.168.55.1:9100"
        labels:
          env: production

rule_files:
  - alerts.yml
