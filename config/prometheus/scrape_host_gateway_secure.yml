# Prometheus scrape config for bearer-token-protected MouseDroid telemetry.
#
# Use with scripts/deploy_monitoring.sh --secure-scrape. The monitoring stack
# mounts config/prometheus/runtime/mousedroid_token into the container and
# MouseDroid removes /metrics from telemetry auth exemptions via
# config/jetson_secure_metrics.yaml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mousedroid
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /metrics
    honor_labels: true
    bearer_token_file: /etc/prometheus/runtime/mousedroid_token
    static_configs:
      - targets:
          - "host.docker.internal:8080"
        labels:
          env: monitoring
          platform: jetson

  - job_name: node
    scrape_interval: 15s
    honor_labels: true
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          env: monitoring

rule_files:
  - /etc/prometheus/alerts.yml