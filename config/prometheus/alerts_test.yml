# =============================================================================
# promtool rule unit tests for alerts.yml (F-052 task 6.1)
# =============================================================================
#   promtool test rules config/prometheus/alerts_test.yml
#
# `promtool check rules` validates syntax only, so a rule over a series that is
# never emitted -- or that can never be true for the series' real shape --
# passes it. Three such rules shipped and passed it. These tests evaluate the
# rules against synthetic series shaped like the ones the registry really
# produces, so "does this alert ever fire" is a test result, not an argument.
#
# The shape that matters: every counter in this registry is PURE-ADD -- absent
# from /metrics until its first write, so the series is born non-zero. A rule
# built only on increase()/rate() never sees a series being born.
#
# Not loaded by Prometheus: the scrape configs list `alerts.yml` explicitly in
# rule_files, never a glob.
# =============================================================================

rule_files:
  - alerts.yml

evaluation_interval: 15s

tests:
  # ---------------------------------------------------------------------------
  # SafetyViolation (critical): the FIRST violation must fire.
  # The previous `increase(...[1m]) > 0` stayed silent here and only fired from
  # the second violation onward.
  # ---------------------------------------------------------------------------
  - name: SafetyViolation fires on a rover's first-ever violation
    interval: 15s
    input_series:
      - series: 'mousedroid_safety_violations_total{instance="rover1",job="mousedroid",law="law1"}'
        values: '_x8 1x40'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: SafetyViolation
        exp_alerts: []
      - eval_time: 2m
        alertname: SafetyViolation
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: rover1
              job: mousedroid
              law: law1
            exp_annotations:
              summary: "Safety violations detected (law=law1)"
              description: "Safety violation counter for law=law1 increased by 1 on rover1 in the last minute. Investigate immediately — constitutional safety constraints may be at risk."
              config_ref: "SafetyConfig (Three Laws enforcement)"
      # The window passes: a single violation does not page forever.
      - eval_time: 4m
        alertname: SafetyViolation
        exp_alerts: []

  - name: SafetyViolation still fires on a later violation
    interval: 15s
    input_series:
      - series: 'mousedroid_safety_violations_total{instance="rover1",job="mousedroid",law="law1"}'
        values: '1x20 2x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: SafetyViolation
        exp_alerts: []
      - eval_time: 5m15s
        alertname: SafetyViolation
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: rover1
              job: mousedroid
              law: law1
            exp_annotations:
              summary: "Safety violations detected (law=law1)"
              description: "Safety violation counter for law=law1 increased by 1 on rover1 in the last minute. Investigate immediately — constitutional safety constraints may be at risk."
              config_ref: "SafetyConfig (Three Laws enforcement)"

  # ---------------------------------------------------------------------------
  # ModelArtifactDigestMismatch (page): written once, at boot, before the
  # telemetry server exists -- so the first scrape already sees the final
  # value and it never changes. It must fire, and keep firing while the rover
  # runs degraded.
  # ---------------------------------------------------------------------------
  - name: ModelArtifactDigestMismatch fires on a boot-written counter and stays firing
    interval: 15s
    input_series:
      - series: 'mousedroid_model_artifact_sha256_mismatches_total{instance="rover1",job="mousedroid",artifact="bdi_weights"}'
        values: '1x400'
    alert_rule_test:
      - eval_time: 30s
        alertname: ModelArtifactDigestMismatch
        exp_alerts: &model_artifact_alert
          - exp_labels:
              severity: page
              subsystem: artifact_integrity
              instance: rover1
              job: mousedroid
              artifact: bdi_weights
            exp_annotations:
              summary: "Model artifact bdi_weights refused by its SHA-256 gate"
              description: "bdi_weights failed its SHA-256 manifest check at boot on rover1 and was refused. For bdi_weights the rover is still running but degraded to the MCTS planner, and stays degraded until restarted with verified weights. See docs/playbooks/artifact-integrity-fail.md."
              config_ref: "cognitive.require_sha256_manifest / world_model.onnx_require_sha256_manifest"
      - eval_time: 90m
        alertname: ModelArtifactDigestMismatch
        exp_alerts: *model_artifact_alert

  - name: ModelArtifactDigestMismatch is silent when nothing was refused
    interval: 15s
    input_series:
      - series: 'mousedroid_uptime_seconds{instance="rover1",job="mousedroid"}'
        values: '0+15x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: ModelArtifactDigestMismatch
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # CloudWeightUpdateDigestMismatch (page): an event. The first refusal creates
  # the pure-add series at 1; it must fire at once and resolve after 15m.
  # ---------------------------------------------------------------------------
  - name: CloudWeightUpdateDigestMismatch fires on the first refusal, then resolves
    interval: 1m
    input_series:
      - series: 'mousedroid_cloud_weight_update_sha256_mismatches_total{instance="rover1",job="mousedroid",repo_id="ianshank/mousedroid-policy-v2"}'
        values: '_x10 1x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: CloudWeightUpdateDigestMismatch
        exp_alerts: []
      - eval_time: 10m
        alertname: CloudWeightUpdateDigestMismatch
        exp_alerts:
          - exp_labels:
              severity: page
              subsystem: artifact_integrity
              instance: rover1
              job: mousedroid
              repo_id: ianshank/mousedroid-policy-v2
            exp_annotations:
              summary: "OTA weight update from ianshank/mousedroid-policy-v2 refused by its SHA-256 gate"
              description: "A downloaded artifact from ianshank/mousedroid-policy-v2 did not match its sha256 manifest on rover1, and the swap was refused. The rover is still on its previous weights. Something upstream produced or served a bad artifact -- investigate before re-publishing. See docs/playbooks/artifact-integrity-fail.md."
              config_ref: "operator default 15m window; gate: cloud weight-update sha256_manifest_filename"
      - eval_time: 30m
        alertname: CloudWeightUpdateDigestMismatch
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # MCP: both rules queried `mousedroid_mcp_tool_calls{...}`, which nothing
  # emits. They must fire on the series the registry really renders.
  # ---------------------------------------------------------------------------
  - name: MCPCircuitOpen fires on the emitted counter name
    interval: 15s
    input_series:
      - series: 'mousedroid_mcp_tool_calls_total{instance="rover1",job="mousedroid",tool="health_check",result="circuit_open"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: MCPCircuitOpen
        exp_alerts:
          - exp_labels:
              severity: page
              subsystem: mcp
              instance: rover1
              job: mousedroid
              tool: health_check
              result: circuit_open
            exp_annotations:
              summary: "MCP tool circuit breaker tripping"
              description: 'mousedroid_mcp_tool_calls_total{result="circuit_open"} is rising at 2.00 per second on tool health_check. Inspect the handler and the upstream driver (ESP32, LLM gateway, TensorRT compiler) for cascading failures.'
              config_ref: "MCPConfig.circuit_breaker (or root CircuitBreakerConfig)"

  - name: MCPRateLimitedSurge fires on the emitted counter name
    interval: 15s
    input_series:
      - series: 'mousedroid_mcp_tool_calls_total{instance="rover1",job="mousedroid",tool="health_check",result="rate_limited"}'
        values: '0+150x80'
    alert_rule_test:
      - eval_time: 12m
        alertname: MCPRateLimitedSurge
        exp_alerts:
          - exp_labels:
              severity: warning
              subsystem: mcp
              instance: rover1
              job: mousedroid
              tool: health_check
              result: rate_limited
            exp_annotations:
              summary: "MCP rate limiter sustained activation"
              description: 'mousedroid_mcp_tool_calls_total{result="rate_limited"} = 10 /s on rover1. Consider raising MCPConfig.rate_limit_rps or throttling the offending client.'
              config_ref: "MCPConfig.rate_limit_rps"
