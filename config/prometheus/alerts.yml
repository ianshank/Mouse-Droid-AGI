# MouseDroid Prometheus Alert Rules
#
# All thresholds are sourced from SafetyConfig defaults in
# src/mousedroid/config/schema.py.  Keep in sync when config changes.
#
# SafetyConfig reference values:
#   max_loop_time_ms:    200.0   -> HighLoopTime critical threshold
#   battery_warn_v:       10.5   -> LowBattery warning threshold
#   battery_critical_v:    9.5   -> LowBattery critical threshold
#   gpu_warn_temp_c:      75.0   -> HighGPUTemp warning threshold
#   gpu_critical_temp_c:  90.0   -> HighGPUTemp critical threshold
#   sensor_stale_s:        0.5   -> (informational, not directly alerting)
#
# Metric names from MetricsConfig (namespace = "mousedroid"):
#   mousedroid_loop_time_ms           (gauge)
#   mousedroid_loop_latency_ms        (histogram)
#   mousedroid_battery_voltage_v      (gauge)
#   mousedroid_gpu_temp_celsius       (gauge)
#   mousedroid_safety_violations_total (labeled counter, label: "law")
#   mousedroid_uptime_seconds         (gauge)
#   mousedroid_frame_drops_total      (counter)
#   mousedroid_ws_client_count        (gauge)
#   mousedroid_publish_hz             (gauge)

groups:
  # ------------------------------------------------------------------
  # HighLoopTime — control-loop latency alerts
  # ------------------------------------------------------------------
  - name: mousedroid_loop_time
    rules:
      # Warning: loop_time_ms > 50 ms sustained for 1 minute
      - alert: HighLoopTime
        expr: mousedroid_loop_time_ms > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Control loop exceeding 50 ms for over 1 minute"
          description: >-
            Loop time is {{ $value | printf "%.1f" }} ms on {{ $labels.instance }}.
            The 30 Hz real-time target (33 ms) is being significantly exceeded.
          config_ref: "SafetyConfig.max_loop_time_ms = 200.0 (warning at 50 ms = 25% of safety limit)"

      # Critical: loop_time_ms > 200 ms sustained for 30 seconds
      # Threshold: SafetyConfig.max_loop_time_ms = 200.0
      - alert: HighLoopTime
        expr: mousedroid_loop_time_ms > 200
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Control loop exceeding max_loop_time_ms safety limit (200 ms)"
          description: >-
            Loop time is {{ $value | printf "%.1f" }} ms on {{ $labels.instance }}.
            SafetyConfig.max_loop_time_ms (200.0) breached — emergency stop threshold.
          config_ref: "SafetyConfig.max_loop_time_ms = 200.0"

  # ------------------------------------------------------------------
  # LowBattery — battery voltage alerts
  # ------------------------------------------------------------------
  - name: mousedroid_battery
    rules:
      # Warning: battery_voltage_v < 10.5 V sustained for 2 minutes
      # Threshold: SafetyConfig.battery_warn_v = 10.5
      - alert: LowBattery
        expr: mousedroid_battery_voltage_v < 10.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Battery voltage below warning threshold (10.5 V)"
          description: >-
            Battery voltage is {{ $value | printf "%.2f" }} V on {{ $labels.instance }}.
            Consider returning to charging station.
          config_ref: "SafetyConfig.battery_warn_v = 10.5"

      # Critical: battery_voltage_v < 9.5 V sustained for 30 seconds
      # Threshold: SafetyConfig.battery_critical_v = 9.5
      - alert: LowBattery
        expr: mousedroid_battery_voltage_v < 9.5
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Battery voltage below critical threshold (9.5 V)"
          description: >-
            Battery voltage is {{ $value | printf "%.2f" }} V on {{ $labels.instance }}.
            Immediate shutdown recommended to prevent LiPo cell damage.
          config_ref: "SafetyConfig.battery_critical_v = 9.5"

  # ------------------------------------------------------------------
  # SafetyViolation — any safety law violation detected
  # ------------------------------------------------------------------
  - name: mousedroid_safety
    rules:
      # Any increase in safety_violations_total — alert immediately (for: 0s)
      # Safety violations are critical; no debounce delay.
      - alert: SafetyViolation
        expr: increase(mousedroid_safety_violations_total[1m]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Safety violations detected (law={{ $labels.law }})"
          description: >-
            Safety violation counter for law={{ $labels.law }} increased by
            {{ $value | printf "%.0f" }} on {{ $labels.instance }} in the last minute.
            Investigate immediately — constitutional safety constraints may be at risk.
          config_ref: "SafetyConfig (Three Laws enforcement)"

  # ------------------------------------------------------------------
  # HighGPUTemp — GPU thermal alerts
  # ------------------------------------------------------------------
  - name: mousedroid_thermal
    rules:
      # Warning: gpu_temp_celsius > 75 C sustained for 2 minutes
      # Threshold: SafetyConfig.gpu_warn_temp_c = 75.0
      - alert: HighGPUTemp
        expr: mousedroid_gpu_temp_celsius > 75
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU temperature above warning threshold (75 C)"
          description: >-
            GPU temperature is {{ $value | printf "%.1f" }} C on {{ $labels.instance }}.
            Consider reducing inference workload or improving cooling.
          config_ref: "SafetyConfig.gpu_warn_temp_c = 75.0"

      # Critical: gpu_temp_celsius > 90 C sustained for 30 seconds
      # Threshold: SafetyConfig.gpu_critical_temp_c = 90.0
      - alert: HighGPUTemp
        expr: mousedroid_gpu_temp_celsius > 90
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "GPU temperature above critical threshold (90 C)"
          description: >-
            GPU temperature is {{ $value | printf "%.1f" }} C on {{ $labels.instance }}.
            Immediate action required to prevent thermal damage. Jetson thermal
            throttling should engage at 95 C, but sustained 90 C is dangerous.
          config_ref: "SafetyConfig.gpu_critical_temp_c = 90.0"

  # ------------------------------------------------------------------
  # TelemetryDown — telemetry process absent
  # ------------------------------------------------------------------
  - name: mousedroid_availability
    rules:
      # Uptime metric absent for 1 minute means the process is down
      - alert: TelemetryDown
        expr: absent(mousedroid_uptime_seconds) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MouseDroid telemetry is down (uptime_seconds absent)"
          description: >-
            The mousedroid_uptime_seconds metric has been absent for over 1 minute
            on {{ $labels.instance }}. The MouseDroid process may have crashed or
            the Prometheus scrape target is unreachable.
          config_ref: "MetricsConfig.namespace = mousedroid, uptime_seconds is always emitted"

  # ------------------------------------------------------------------
  # Lidar — scan liveness and obstacle proximity
  # ------------------------------------------------------------------
  - name: mousedroid_lidar
    rules:
      # Liveness: scan_points == 0 means the LiDAR driver is returning empty
      # scans (stall, disconnect, or permissions error).
      - alert: LidarScanStale
        expr: mousedroid_lidar_scan_points == 0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "LiDAR scans are empty (0 points) for more than 10 s"
          description: >-
            mousedroid_lidar_scan_points has been 0 on {{ $labels.instance }} for
            over 10 seconds. The LiDAR driver is likely stalled or disconnected.
          config_ref: "LidarConfig — check hardware/lidar connection"

      # Proximity: minimum distance below 0.2 m for 2 s => imminent collision.
      - alert: LidarObstacleCritical
        expr: mousedroid_lidar_min_distance_m < 0.2
        for: 2s
        labels:
          severity: critical
        annotations:
          summary: "Obstacle closer than 20 cm detected by LiDAR"
          description: >-
            mousedroid_lidar_min_distance_m = {{ $value | printf "%.2f" }} m on
            {{ $labels.instance }}. Safety monitor should have already engaged
            the emergency brake; investigate if the droid is still moving.
          config_ref: "SafetyConfig — obstacle proximity"

  # ------------------------------------------------------------------
  # MCP server — request latency, circuit breaker, rate limiting.
  # Series originate from MetricsRegistry under the configured
  # namespace ("mousedroid_" by default; if MetricsConfig.namespace is
  # overridden, swap the prefix here to match).
  # ------------------------------------------------------------------
  - name: mousedroid_mcp
    rules:
      # Warning: p95 request latency > 500 ms over 5 min.
      - alert: MCPHighLatency
        expr: histogram_quantile(0.95, rate(mousedroid_mcp_request_latency_ms_bucket[5m])) > 500
        for: 5m
        labels:
          severity: warning
          subsystem: mcp
        annotations:
          summary: "MCP p95 request latency above 500 ms"
          description: >-
            p95 of mousedroid_mcp_request_latency_ms_bucket is
            {{ $value | printf "%.1f" }} ms on {{ $labels.instance }}.
            Investigate slow tool handlers (set_velocity, tensorrt_compile)
            or saturated stdio/SSE transports.
          config_ref: "MCPConfig.request_timeout_s, MCPConfig.rate_limit_rps"

      # Page: any circuit breaker trip on a tool call indicates an
      # underlying handler failing repeatedly inside the bridge.
      - alert: MCPCircuitOpen
        expr: rate(mousedroid_mcp_tool_calls{result="circuit_open"}[1m]) > 1
        for: 1m
        labels:
          severity: page
          subsystem: mcp
        annotations:
          summary: "MCP tool circuit breaker tripping"
          description: >-
            mousedroid_mcp_tool_calls{result="circuit_open"} is rising at
            {{ $value | printf "%.2f" }} per second on tool {{ $labels.tool }}.
            Inspect the handler and the upstream driver (ESP32, LLM gateway,
            TensorRT compiler) for cascading failures.
          config_ref: "MCPConfig.circuit_breaker (or root CircuitBreakerConfig)"

      # Warning: rate limiter sustained activation suggests a misbehaving
      # client or undersized rate budget for the workload.
      - alert: MCPRateLimitedSurge
        expr: rate(mousedroid_mcp_tool_calls{result="rate_limited"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
          subsystem: mcp
        annotations:
          summary: "MCP rate limiter sustained activation"
          description: >-
            mousedroid_mcp_tool_calls{result="rate_limited"} = {{ $value }} /s
            on {{ $labels.instance }}. Consider raising
            MCPConfig.rate_limit_rps or throttling the offending client.
          config_ref: "MCPConfig.rate_limit_rps"

  # ------------------------------------------------------------------
  # PR-A2 Replay / VLA / VLM observability alerts (added in PR-B2).
  #
  # All thresholds are documented operator-tunable defaults — adjust the
  # `expr:` values and the matching `for:` window when tuning. See
  # `docs/architecture/ADR-006-telemetry-server.md` "PR-A2 addendum" for
  # design rationale.
  #
  # NOTE: writer-side instrumentation for these metric families is deferred
  # to a follow-up PR (see ADR-006 addendum). Until that lands these rules
  # will silently match-zero — promtool still validates their syntax.
  # ------------------------------------------------------------------
  - name: mousedroid_replay_vla_vlm
    rules:
      # Warning: replay schema-mismatch rate elevated. A non-zero rate over
      # 5 minutes means LMDB replay records are being dropped — either the
      # store has corrupt entries or training-side SCHEMA_VERSION has drifted
      # ahead of the runtime constant.
      - alert: ReplaySchemaMismatchSpike
        expr: rate(mousedroid_replay_records_total{outcome="schema_mismatch"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          subsystem: replay
        annotations:
          summary: "Replay schema-mismatch rate elevated (>0.1/s sustained 5m)"
          description: >-
            mousedroid_replay_records_total{outcome="schema_mismatch"} is rising at
            {{ $value | printf "%.3f" }} /s on {{ $labels.instance }}.
            Replay corruption or schema drift. See
            mousedroid.experience.record.SCHEMA_VERSION for the runtime constant
            and re-export experience if the store is stale.
          config_ref: "operator-tunable threshold (default 0.1/s over 5m)"

      # Warning: VLA p95 inference latency >100 ms means the policy branch
      # cannot keep up with the 30 Hz orchestrator tick — fallback should be
      # firing. Match the value against the configured
      # MetricsConfig.vla_inference_seconds_buckets envelope.
      #
      # ``sum by (instance, le)`` (rather than ``sum by (le)``) preserves
      # the ``instance`` label so the annotation's ``{{ $labels.instance }}``
      # interpolation identifies *which* Jetson is slow when the fleet has
      # multiple scrape targets. Aggregating by ``le`` alone would collapse
      # all instances into a single fleet-wide quantile and mix unrelated
      # latency distributions.
      - alert: VLAInferenceLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (instance, le) (rate(mousedroid_vla_inference_seconds_bucket[5m]))
          ) > 0.1
        for: 2m
        labels:
          severity: warning
          subsystem: vla
        annotations:
          summary: "VLA p95 inference latency >100 ms sustained 2m"
          description: >-
            histogram_quantile(0.95, ...vla_inference_seconds_bucket...) =
            {{ $value | printf "%.3fs" }} on {{ $labels.instance }}.
            VLA branch is missing its 30 Hz tick deadline; the policy_selector
            should be falling back. Check the VLATimeoutSpike alert below.
          config_ref: "operator-tunable threshold (default 0.1 s over 2m)"

      # Warning: a sustained VLA timeout rate by mode indicates the active
      # backend cannot meet its budget under load. The narrowed
      # VLAActiveBackendLiteral excludes "none", so any series here is
      # actionable.
      #
      # ``sum by (instance, mode)`` (rather than ``sum by (mode)``) preserves
      # the ``instance`` label so the annotation can identify per-Jetson
      # which fleet member is timing out — fleet-aggregated alerts mix
      # unrelated targets and make triage ambiguous.
      - alert: VLATimeoutSpike
        expr: sum by (instance, mode) (rate(mousedroid_vla_timeouts_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
          subsystem: vla
        annotations:
          summary: "VLA timeout rate elevated for mode={{ $labels.mode }}"
          description: >-
            mousedroid_vla_timeouts_total{mode="{{ $labels.mode }}"} is rising at
            {{ $value | printf "%.3f" }} /s on {{ $labels.instance }}.
            VLA backend cannot meet its inference budget; correlate with
            VLAInferenceLatencyHigh and consider widening
            MetricsConfig.vla_inference_seconds_buckets or downgrading the
            policy_selector to nav_agent.
          config_ref: "operator-tunable threshold (default 0.01/s over 5m)"

      # Info: VLM progress-reward cache hit-rate collapsed below 50% in
      # the recent 10-minute window. Not critical — the cache is an
      # optimization — but a sustained collapse points at either a sparse
      # VLM key space or aggressive eviction. Uses ``rate()`` rather than
      # raw counters so a fresh collapse triggers promptly even after a
      # long history of good hit-rates (raw-counter ratios are dominated
      # by lifetime totals and would mask recent regressions).
      #
      # The ``or vector(0)`` clauses guard against the *absent-series*
      # failure mode: each counter is rendered only when its value is
      # positive, so an all-hit (or all-miss) workload would have one side
      # absent and the binary expression would evaluate to an empty vector
      # — silently masking the very collapse this alert is meant to catch.
      # ``rate(...) or vector(0)`` ensures both sides resolve to a numeric
      # value even when their series are absent. The +0.0001 NaN guard
      # protects 0/0 when both rate windows are empty (no observations yet).
      - alert: VLMCacheHitRateCollapse
        expr: |
          (
            (rate(mousedroid_vlm_progress_cache_hits_total[10m]) or vector(0))
            /
            (
              (rate(mousedroid_vlm_progress_cache_hits_total[10m]) or vector(0))
              + (rate(mousedroid_vlm_progress_cache_misses_total[10m]) or vector(0))
              + 0.0001
            )
          ) < 0.5
        for: 10m
        labels:
          severity: info
          subsystem: vlm
        annotations:
          summary: "VLM progress-cache hit-rate below 50% for 10m"
          description: >-
            hits / (hits + misses) over the last 10m = {{ $value | printf "%.2f" }}
            on {{ $labels.instance }}. Cache is thrashing — investigate VLM key
            sparsity or LRU sizing in mousedroid.reward.vlm_progress.
          config_ref: "operator-tunable threshold (default 0.5 ratio over 10m)"

  # Tier B2 — world-model observe_step latency
  - name: mousedroid_world_model
    interval: 30s
    rules:
      # Warning: DualStreamRSSM.observe_step p95 latency exceeded the 30 Hz
      # orchestrator tick budget (33 ms). On the Orin Nano with TensorRT EP
      # the target is <10 ms; this warning fires when even the portable
      # dev gate of 33 ms is breached, which means the world model is
      # missing its tick deadline and downstream systems (MCTS, action
      # selection) are running on stale (h, z).
      #
      # The 33 ms threshold corresponds to one 30 Hz tick. Operators on the
      # Jetson should tighten this to 10 ms (Orin Nano + TensorRT EP target)
      # by overriding the alert threshold OR by relying on the matching
      # MOUSEDROID_OBSERVE_STEP_BUDGET_MS=10 env var in the perf-budget test.
      - alert: WorldModelObserveStepLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (instance, le) (
              rate(mousedroid_world_model_observe_step_seconds_bucket[5m])
            )
          ) > 0.033
        for: 2m
        labels:
          severity: warning
          subsystem: world_model
        annotations:
          summary: "DualStreamRSSM.observe_step p95 above 33 ms (30 Hz tick budget)"
          description: >-
            p95 observe_step wall-clock = {{ $value | printf "%.3f" }} s on
            {{ $labels.instance }}. World model is missing its 30 Hz tick
            deadline. On Jetson Orin Nano, flip cfg.world_model.engine to
            "onnx_trt" (PR #92) or run scripts/export_dual_stream_rssm_onnx.py
            to acquire the ONNX artifact.
          config_ref: "operator-tunable threshold (default 33 ms / Jetson 10 ms)"
