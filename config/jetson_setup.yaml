# Jetson Orin Nano deployment configuration.
# Used by deploy scripts — not loaded by the application.
jetson:
  host: "mousedroid.local"
  user: "jetson"
  ssh_port: 22
  install_dir: "/opt/mousedroid"
  config_dir: "/etc/mousedroid"
  swap_size_gb: 4               # 4GB for SD card (use 8 for NVMe/SSD)
  power_mode: 0                 # 15W (nvpmodel mode)
  storage_type: "sdcard"        # "sdcard" | "nvme" | "emmc"
  active_config: "jetson_sdcard_64gb.yaml"
