platform: mouse_droid
mock_hardware: false
debug: false

loop:
  perception_hz: 30.0
  ultrasonic_hz: 20.0
  control_hz: 30.0
  planning_hz: 10.0
  audio_hz: 16.0

model:
  vision_dim: 256
  ultrasonic_dim: 1
  motor_state_dim: 4
  hidden_dim: 256
  latent_dim: 64
  action_dim: 3
  obs_dim: 256
  vision_proj_dim: 128
  ultrasonic_proj_dim: 32
  motor_proj_dim: 32

mcts:
  n_simulations_base: 50
  n_simulations_max: 200
  rollout_depth: 5
  gamma: 0.97
  n_action_candidates: 9
  ucb_c: 1.41
  ucb_candidates: [0.5, 1.0, 1.41, 2.0, 3.0]
  warmstart_n_episodes: 100

surprise:
  ema_alpha: 0.1
  high_threshold: 2.0
  critical_threshold: 5.0

safety:
  min_forward_clearance_m: 0.20
  max_velocity_mps: 0.5
  sensor_stale_s: 0.5
  min_valid_sensors: 2
  gpu_warn_temp_c: 75.0
  gpu_critical_temp_c: 90.0
  battery_warn_v: 10.5
  battery_critical_v: 9.5

esp32:
  protocol: serial
  serial_port: "/dev/ttyUSB0"
  serial_baud: 1000000
  command_timeout_s: 0.5
  keepalive_hz: 10.0
  max_velocity_mps: 0.5
  max_omega_rads: 2.0
  wifi_host: "192.168.4.1"
  wifi_port: 80

ultrasonic:
  trigger_pin: 23
  echo_pin: 24
  max_range_m: 4.0
  min_range_m: 0.02
  timeout_s: 0.1
  speed_of_sound_mps: 343.0

# microphone:          # Uncomment to enable SuziePi USB microphone
#   sample_rate: 16000
#   channels: 1
#   chunk_size: 1024
#   device_name: "SuziePi"
#   format: "float32"

camera:
  resolution_width: 640
  resolution_height: 480
  fps: 30
  feature_dim: 256
  use_onboard_inference: true

