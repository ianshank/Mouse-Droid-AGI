platform: mouse_droid
mock_hardware: false
debug: false

loop:
  perception_hz: 30.0
  ultrasonic_hz: 20.0
  control_hz: 30.0
  planning_hz: 10.0
  audio_hz: 16.0

model:
  vision_dim: 256
  ultrasonic_dim: 1
  motor_state_dim: 4
  hidden_dim: 256
  latent_dim: 64
  action_dim: 3
  obs_dim: 256
  vision_proj_dim: 128
  ultrasonic_proj_dim: 32
  motor_proj_dim: 32
  audio_dim: 1024
  audio_proj_dim: 32

mcts:
  n_simulations_base: 50
  n_simulations_max: 200
  rollout_depth: 5
  gamma: 0.97
  n_action_candidates: 9
  ucb_c: 1.41

surprise:
  ema_alpha: 0.1
  high_threshold: 2.0
  critical_threshold: 5.0

safety:
  min_forward_clearance_m: 0.20
  max_velocity_mps: 0.5
  sensor_stale_s: 0.5
  min_valid_sensors: 2
  gpu_warn_temp_c: 75.0
  gpu_critical_temp_c: 90.0
  battery_warn_v: 10.5
  battery_critical_v: 9.5

esp32:
  protocol: serial
  serial_port: "/dev/ttyUSB0"
  serial_baud: 1000000
  command_timeout_s: 0.5
  keepalive_hz: 10.0
  max_velocity_mps: 0.5
  max_omega_rads: 2.0
  wifi_host: "192.168.4.1"
  wifi_port: 80

ultrasonic:
  trigger_pin: 23
  echo_pin: 24
  max_range_m: 4.0
  min_range_m: 0.02
  timeout_s: 0.1
  speed_of_sound_mps: 343.0

microphone:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  device_name: "USB"
  format: "float32"

camera:
  resolution_width: 640
  resolution_height: 480
  fps: 30
  feature_dim: 256
  use_onboard_inference: true
  feature_extractor: "auto"
  l2_normalize: true

jetson:
  tensorrt_enabled: true
  gpu_memory_fraction: 0.5
  power_mode: "15W"
  dla_enabled: false
  precision: "fp16"
  workspace_gb: 1.0

robot:
  wheel_base_m: 0.20
  track_width_m: 0.20
  max_speed_mps: 0.50
  wheel_radius_m: 0.042
  wheel_type: mecanum

experience:
  path: "/home/jetson/mousedroid_experience"
  map_size_gb: 20
  flush_every_n: 30

memory:
  working_context_size: 8192
  episodic_capacity: 50000
  semantic_dim: 256
  consolidation_batch_size: 32
  consolidation_interval_s: 60.0

learning:
  ewc_lambda: 5000.0
  ewc_fisher_samples: 200
  progressive_enabled: false

reward:
  weight_truthfulness: 0.4
  weight_helpfulness: 0.3
  weight_safety: 0.2
  weight_engagement: 0.1

curiosity:
  intrinsic_reward_scale: 0.1
  forward_model_hidden: 256
  inverse_model_hidden: 256

logging:
  level: "INFO"
  format: "json"

health:
  check_interval_s: 5.0
  gpu_temp_warn_c: 75.0
  gpu_temp_critical_c: 90.0
  memory_warn_pct: 85.0

training:
  batch_size: 32
  learning_rate: 0.0003
  epochs: 100
  checkpoint_every_n: 10

retry:
  max_attempts: 3
  base_delay_s: 1.0
  max_delay_s: 30.0
  exponential_base: 2.0

circuit_breaker:
  failure_threshold: 5
  recovery_timeout_s: 30.0
  half_open_max_calls: 3

cognitive:
  weights_dir: "weights/bdi/"
  huggingface_repo: "ianshank/mousedroid-weights"
  huggingface_subfolder: "bdi"
  auto_download: true
  fallback_to_mcts: true
  download_max_retries: 3
  download_backoff_base: 2.0

metrics:
  enabled: true
  export_interval_s: 10.0

telemetry:
  enabled: false
  host: "0.0.0.0"
  port: 8080
  ws_path: "/ws"
  api_prefix: "/api/v1"
  publish_hz: 10.0
  max_clients: 10
  queue_size: 64
  serialization: "json"
  # api_key: null       # Uncomment and set for authentication
  mdns_enabled: true
  mdns_service_name: "MouseDroid Telemetry"
  cors_origins: ["*"]
  log_stream_buffer: 200
