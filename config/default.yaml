# --- Sensor Fusion (disabled by default — enable on Jetson) ---
# fusion:
#   enabled: false
#   depth_model: "MiDaS_small"
#   midas_hub_repo: "intel-isl/MiDaS"
#   depth_max_hz: 10.0

jetson:
  tensorrt_enabled: true
  gpu_memory_fraction: 0.5
  power_mode: "15W"
  dla_enabled: false
  precision: "fp16"
  workspace_gb: 1.0

robot:
  wheel_base_m: 0.20
  track_width_m: 0.20
  max_speed_mps: 0.50
  wheel_radius_m: 0.042
  wheel_type: mecanum

experience:
  path: "/home/jetson/mousedroid_experience"
  map_size_gb: 20
  flush_every_n: 30

memory:
  working_context_size: 8192
  episodic_capacity: 50000
  semantic_dim: 256
  consolidation_batch_size: 32
  consolidation_interval_s: 60.0

learning:
  ewc_lambda: 5000.0
  ewc_fisher_samples: 200
  progressive_enabled: false

reward:
  weight_truthfulness: 0.4
  weight_helpfulness: 0.3
  weight_safety: 0.2
  weight_engagement: 0.1

curiosity:
  intrinsic_reward_scale: 0.1
  forward_model_hidden: 256

# llm_gateway:                         # Uncomment to enable NL mission translation
#   model_path: "/home/jetson/models/Phi-3-mini-4k-instruct-q4.gguf"
#   n_threads: 4
#   n_gpu_layers: -1
#   max_tokens: 256
#   temperature: 0.1
  inverse_model_hidden: 256

logging:
  level: "INFO"
  format: "json"

health:
  check_interval_s: 5.0
  gpu_temp_warn_c: 75.0
  gpu_temp_critical_c: 90.0
  memory_warn_pct: 85.0

training:
  batch_size: 32
  learning_rate: 0.0003
  epochs: 100
  checkpoint_every_n: 10
  annotation:
    human_safety_radius_m: 0.5
    battery_warn_v: 10.8
    obstacle_clearance_m: 0.25
    episode_human_prob: 0.10
    episode_command_prob: 0.10
    n_episodes: 500
    max_steps: 50
    nominal_battery_v: 12.0
    nominal_obstacle_dist_m: 2.0

retry:
  max_attempts: 3
  base_delay_s: 1.0
  max_delay_s: 30.0
  exponential_base: 2.0

circuit_breaker:
  failure_threshold: 5
  recovery_timeout_s: 30.0
  half_open_max_calls: 3

cognitive:
  weights_dir: "weights/bdi/"
  huggingface_repo: "ianshank/mousedroid-weights"
  auto_download: true
  fallback_to_mcts: true
  download_max_retries: 3
  download_backoff_base: 2.0

metrics:
  enabled: true
  export_interval_s: 10.0
