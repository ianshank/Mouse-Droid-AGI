# MouseDroid Sequential Training Configuration
# ─────────────────────────────────────────────
# Tuned hyperparameters for full end-to-end training on Jetson Orin Nano.
# See ADR-006 and PRD for rationale.

platform: mouse_droid
mock_hardware: true
debug: false

logging:
  level: "INFO"
  format: "console"

training:
  # ── Phase 0: Data Generation ──────────────────────
  n_episodes: 3000          # Synthetic episodes (up from 1000 for coverage)
  sequence_length: 50       # Steps per episode

  # ── Phase 1: RSSM Pretraining ─────────────────────
  epochs: 200               # Training epochs (up from 100 for convergence)
  batch_size: 16            # Conservative for 8 GB unified memory
  learning_rate: 3.0e-4     # Adam learning rate
  kl_beta: 0.5              # KL loss weight (lowered to prioritize reconstruction)
  checkpoint_every_n: 25    # Save checkpoint every N epochs

  # Paths
  data_dir: "training/data"
  weights_dir: "weights"

  # ── GPU Config ────────────────────────────────────
  gpu:
    device: null            # null = auto-detect (cuda:0 if available)
    enable_amp: true        # Automatic Mixed Precision (Ampere optimised)
    memory_limit_gb: 6.0    # Leave 2 GB headroom for OS + display
    auto_batch_reduce: true # Auto-halve batch on OOM

# ── Phase 4: Constitutional RL (PPO) ────────────────
ppo:
  clip_epsilon: 0.2
  gae_lambda: 0.95
  ppo_epochs: 4
  n_rollout_steps: 128
  n_training_episodes: 5000
  n_validation_episodes: 1000
