platform: mouse_droid
mock_hardware: true
debug: true

logging:
  level: "DEBUG"
  format: "console"

# PR #4 — mock-mode dashboard. The real aiohttp telemetry server is
# bound on localhost and the MockTelemetrySource synthesises plausible
# scans + camera features so operators can hit
# http://localhost:8080/lidar with no rover attached.
telemetry:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  mdns_enabled: false
  # PR #4 mock visibility (both defaults are True — listed here so
  # operators know the knobs exist).
  mock_force_real_when_enabled: true
  mock_telemetry_source_enabled: true
  lidar_raw_publish_hz: 5.0
  sensor_liveness_stale_s: 2.0

# Mock-hardware overlay widens DR ranges for stress testing — exercises
# wider noise/drop envelopes than the production overlay so unit/integration
# tests catch failure modes early.
domain_randomization:
  enabled: true
  brightness: {low: 0.4, high: 1.6}
  contrast: {low: 0.5, high: 1.5}
  gaussian_noise_std: {low: 0.0, high: 0.08}
  ultrasonic_noise_m: {low: 0.0, high: 0.08}
  ultrasonic_dropout_prob: {low: 0.0, high: 0.15}
  wheel_friction: {low: 0.5, high: 1.5}
  wheel_slip: {low: 0.0, high: 0.30}
  motor_gain: {low: 0.7, high: 1.3}
  uart_latency_ms: {low: 1.0, high: 30.0}
  encoder_dropout_prob: {low: 0.0, high: 0.10}
  push_force_n: {low: 0.0, high: 3.0}
  push_event_prob: 0.15
  feature_noise_std: {low: 0.0, high: 0.05}
