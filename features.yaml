  - id: "F-028"
    epic: "Quality Gates"
    name: "Functional, user-journey and security test tiers reach a CI path"
    description: >-
      Three test tiers - tests/functional/, tests/user_journey/ and
      tests/security/ - ran in ZERO CI paths: absent from scripts/ci.sh, from
      .github/workflows/ci.yml and from every Makefile target, so they executed
      only under a bare `pytest` and could rot invisibly. This is the same
      failure mode the smoke tier had before PR #178. tests/security/ holds the
      pre-egress path through the gateway seam for the RegexInjectionFilter
      that docs/CHARTER.md names as the control making the cloud-LLM egress
      carve-out (#107) acceptable. (The filter's unit coverage in
      tests/unit/security/test_injection_filter.py already ran - this closes a
      wiring gap, not a coverage hole.) All
      three tiers are wired into the blocking `test` job and into ci.sh, outside
      the MOUSEDROID_CI_SLIM skip (the whole set runs in ~2.5s), and pinned by
      TestOrphanTierWiring so the wiring cannot silently regress. They are
      deliberately NOT placed in the ci.yml job named `security`, which is
      continue-on-error and would swallow every failure.
    category: "validation"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "all three tiers appear in the blocking ci.yml `test` job and in scripts/ci.sh"
      - "tests/security does NOT appear in the advisory continue-on-error `security` job"
      - "the ci.sh stage precedes the MOUSEDROID_CI_SLIM gate (runs outside the slim skip)"
      - "TestOrphanTierWiring fails when the wiring is removed (verified by reverting)"
    validation_command: "bash scripts/validations/F-028.sh"
    implemented_in: "9bd3dc7549b09c973e8ff5ce1a737e1076cdc5d2"
    depends_on: ["F-001"]
    notes: >-
      implemented_in pins PR #201's squash merge, the commit this feature
      actually landed in - the catalog convention (F-015..F-020 pin a12c95b,
      PR #151's squash; F-021 pins 40a6399, PR #153's). It previously pinned
      the branch commit df928d9, which the squash did not preserve, leaving it
      reachable only from the feature branch. The harness resolves this field
      with git rev-parse (harness/spec.py), an EXISTENCE check - so it passed
      while that branch lived and would have started failing --strict-git the
      moment it was deleted. Never a branch point either, which would claim
      provenance for a commit where the feature does not exist.

  - id: "F-029"
    epic: "Quality Gates"
    name: "GCP off-device egress channels default OFF"
    description: >-
      GCPLoggingConfig.enabled and GCPMonitoringConfig.enabled defaulted True
      while GCPFirestoreConfig.enabled defaulted False, and GCPPubSubConfig /
      GCPStorageConfig had no enabled field at all - the latter two being the
      ones actually wired, since build_cloud_telemetry_sink and
      build_cloud_experience_exporter gated on `cfg.gcp is None` alone. Settings.gcp is Optional
      and defaults None, so nothing egressed on a stock config - but an operator
      adding a minimal `gcp:` block for one reason (Firestore, storage) silently
      enabled TWO off-device egress channels they never named. Both now default
      False, so every GCP egress channel is opt-in. CHARTER §6 requires new
      capabilities be additive and opt-in, never a silent behaviour change; this
      also removes the trap ahead of wiring the cloud components (F-032), which
      must not land while a default-ON egress path exists.
    category: "non-functional"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "logging / monitoring / firestore / pubsub / storage all default enabled=False"
      - "a partial gcp: block (project_id only) opens no egress channel"
      - "build_cloud_telemetry_sink and build_cloud_experience_exporter both return None for a partial block"
      - "explicit enabled=true still works — the default is a default, not a pin"
      - "config/gcp_digital_twin.yaml resolves to the same effective state (it sets all three explicitly)"
    validation_command: "bash scripts/validations/F-029.sh"
    implemented_in: "9bd3dc7549b09c973e8ff5ce1a737e1076cdc5d2"
    depends_on: ["F-001"]
    notes: >-
      Gates F-032 (cloud component wiring) - that bundle must not land while a
      default-ON egress path exists. implemented_in pins PR #201's squash
      merge, the commit this feature actually landed in. It previously pinned
      the branch commit 5c2f044, which the squash did not preserve, leaving it
      reachable only from the feature branch.
