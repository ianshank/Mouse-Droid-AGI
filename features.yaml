      Known, accepted, pre-existing gap surfaced by security-scanner
      during this bundle's review round (not introduced by this bundle --
      neither the field's type nor the log line it flags are touched
      here): ExperimentLoggerConfig.tracking_uri stays a plain str, not
      SecretStr, unlike the sibling TelemetryConfig.api_key field in the
      same module. MlflowExperimentLogger.__init__ logs it raw via
      mlflow_logger_initialised. The schema default this bundle ships
      (sqlite:///mlflow.db) carries no credentials, so this is dormant
      today -- but the field's own docstring already documents remote
      http://host:port URIs, and this bundle's own framing points further
      toward database-backed stores generally, which can carry embedded
      credentials (e.g. postgresql://user:pass@host/db) if an operator
      overlay ever sets one. Not fixed here: SecretStr would need
      .get_secret_value() threaded through _resolve_tracking_uri and
      MlflowExperimentLogger.__init__, a real API-shape change outside
      this bundle's stated scope (a default-value flip + CI job + docs),
      not a proportionate widening of the one field/docstring already
      being touched. Surfaced rather than silently fixed or silently
      dropped, per CHARTER Section 6 -- deferred to a separate,
      not-yet-numbered future change if an operator ever needs a
      credentialed tracking_uri in practice.

      Six-agent review round (peer-review, config, logging, tests, docs,
      automation) returned REQUEST_CHANGES; full record in the bundle's
      peer-review.md. Three findings reversed earlier decisions in this
      same bundle, so they are recorded here rather than only in the
      commit log: (1) an earlier revision left _resolve_tracking_uri
      untouched and framed that as a win -- it made the new default the
      ONLY unpinned local store, contradicting the function's own
      chdir-survival contract; sqlite:/// is now pinned like file:.
      (2) The first test for that pin asserted "a chdir cannot strand
      the database" and PASSED WITH THE FIX REVERTED -- a tautology,
      caught only by running the revert. mlflow caches its store per URI
      string per process, and two processes launched from different
      directories split regardless, both verified directly; the pin's
      real benefit is that the effective path is absolute and therefore
      reportable via the new experiment_logger_tracking_uri_resolved
      event. The test was rewritten to assert only what goes red without
      the pin. (3) The residual-risk statement understated the blast
      radius: it named mlflow-skinny 2.x pins, but this bundle's own
      88/88-green verification proves the file backend works on 3.x, and
      the real affected population is anyone using the documented env-var
      opt-in, which materializes the whole config block from defaults.
      Corrected in proposal.md and CHANGELOG.md and pinned by a test.

      Also fixed during that round: the mlflow-extras job installed
