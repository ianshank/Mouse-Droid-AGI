  - id: "F-029"
    epic: "Quality Gates"
    name: "GCP off-device egress channels default OFF"
    description: >-
      GCPLoggingConfig.enabled and GCPMonitoringConfig.enabled defaulted True
      while GCPFirestoreConfig.enabled defaulted False, and GCPPubSubConfig /
      GCPStorageConfig had no enabled field at all - the latter two being the
      ones actually wired, since build_cloud_telemetry_sink and
      build_cloud_experience_exporter gated on `cfg.gcp is None` alone. Settings.gcp is Optional
      and defaults None, so nothing egressed on a stock config - but an operator
      adding a minimal `gcp:` block for one reason (Firestore, storage) silently
      enabled TWO off-device egress channels they never named. Both now default
      False, so every GCP egress channel is opt-in. CHARTER §6 requires new
      capabilities be additive and opt-in, never a silent behaviour change; this
      also removes the trap ahead of wiring the cloud components (F-032), which
      must not land while a default-ON egress path exists.
