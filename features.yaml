# Feature catalog — the cognitive anchor of the spec-driven harness.
# See HARNESS_SPEC.md §5. There is NO `passes` field: a feature is `done` only
# when its validation_command exits 0 under scripts/validate.py (the Golden Rule).
#
# implemented_in must be a RESOLVABLE git ref (validate.py --strict-git checks it):
#   - pre-existing subsystems → their landing commit SHA on main
#   - harness-introduced features → the working branch (POST-MERGE: replace with
#     the squash/merge SHA so the nightly --strict-git job stays green on main).
features:
  - id: "F-001"
    epic: "Harness"
    name: "Spec-driven harness initialized"
    description: >-
      HARNESS_SPEC.md, features.yaml, features.schema.json, validate.py and
      select_next.py exist and parse. The harness can validate itself.
    category: "infrastructure"
    priority: "critical"
    status: "done"
    tier: "fast"
    verification:
      - "Core harness files present and parseable"
      - "scripts/validations/F-001.sh exits 0"
    validation_command: "bash scripts/validations/F-001.sh"
    implemented_in: "7f375815f53729ab54a271df6ae5835b8d1356d4"
    depends_on: []
    notes: "Routed through F-001.sh (not validate.py --check F-001) to avoid the recursive self-reference in the upstream template example."

