  - id: "F-032"
    epic: "GCP Digital Twin"
    name: "GCP observability wiring — logging, monitoring, Firestore sync"
    description: >-
      Wires three already-implemented, already-unit-tested cloud components
      into the production path: CloudLoggingSink (structlog -> Cloud
      Logging), CloudMetricsExporter (MetricsRegistry -> Cloud Monitoring),
      and CloudFirestoreSync (episodic memory -> Firestore). All three
      existed fully built and tested but were never constructed by
      factory.py or threaded through orchestrator.py/main.py, mirroring the
      gap build_cloud_telemetry_sink/build_cloud_experience_exporter closed
      for Pub/Sub and GCS. New factory.py builders
      (build_cloud_logging_sink, build_cloud_metrics_exporter,
      build_cloud_firestore_sync) follow the existing two-builder idiom
      (cfg.gcp is None guard, per-block .enabled guard, function-scoped
      try/except ImportError, construct, log, return) plus a fifth step the
      two precedent builders never needed: an explicit null-collaborator
      guard, since CloudMetricsExporter.__init__'s registry and
      CloudFirestoreSync.__init__'s episodic are both non-Optional while
      build_metrics_registry/build_memory_tier can each independently
      return None -- an unvalidated but legal config combination
      (e.g. gcp.firestore.enabled=true + the default memory.enabled=false)
      would otherwise crash build_orchestrator() outright. A new
      CloudFirestoreSyncProtocol was authored in cloud/protocol.py matching
      CloudFirestoreSync's start/sync_once/close shape;
      CloudLoggingSinkProtocol was widened to also declare start/close
      (previously only __call__), since main.py drives that lifecycle
      directly rather than through the orchestrator.
      MouseDroidOrchestrator gained cloud_metrics_exporter/
      cloud_firestore_sync constructor params with LIFO-ordered lifecycle
      wiring in _start_cloud_subsystems/_stop_cloud_subsystems --
      cloud_metrics_exporter exposes stop(), not close(), unlike its three
      siblings. CloudLoggingSink's lifecycle deliberately stays OUTSIDE the
      orchestrator: configure_logging() runs synchronously in
      main.py::cli_entry() before build_orchestrator() is ever called, so
      folding it into the orchestrator would create two disconnected
      instances. main.py now builds it once in cli_entry(), threads the
      same instance into configure_logging(cloud_logging_sink=...) (whose
      processor-chain insertion was already implemented and tested) and
      into new keyword params on _run()/_health_check() (default None),
      with start()/close() independently wrapped in try/except Exception in
      both functions -- _health_check() previously had no try/finally at
      all, so it gained one specifically to guarantee the close-on-exit
      path runs even through its existing sys.exit(1) branch. This keeps an
      unreachable Cloud Logging backend from blocking rover boot, mirroring
      the existing OTA weight-update poller's boot-resilience pattern one
      function away in orchestrator.py.
    category: "functional"
    priority: "medium"
    status: "done"
    tier: "fast"
    verification:
      - "build_cloud_logging_sink/build_cloud_metrics_exporter/build_cloud_firestore_sync each return None when cfg.gcp is None, when their .enabled flag is false, and (the latter two) when their required collaborator is None"
      - "each new builder returns None and logs a warning when its underlying google-cloud-* SDK is genuinely absent (module_available(...) probe), or when the lightweight wrapper import fails"
      - "MouseDroidOrchestrator starts/stops cloud_metrics_exporter and cloud_firestore_sync only when wired, in LIFO order relative to cloud_sink/cloud_experience_exporter, and calls .stop() (not .close()) on cloud_metrics_exporter"
      - "main.py's _run and _health_check both complete without touching cloud_logging_sink when it is None (the default), and both close it even when the guarded body raises or calls sys.exit"
      - "configure_logging(cloud_logging_sink=...) actually forwards a live log event, not just object identity"
      - "a start-time failure in any of the four _start_cloud_subsystems collaborators (unreachable backend, missing SDK) logs a warning and does not prevent orchestrator startup"
    validation_command: "bash scripts/validations/F-032.sh"
    implemented_in: "69b9aa05096d469be7b79c57ea93ca90d76f637a"
    depends_on: ["F-029"]
    notes: >-
      No dependency on F-030/F-031 -- disjoint files (factory.py,
      orchestrator/orchestrator.py, main.py, cloud/protocol.py) from both.
      implemented_in was pinned in this dedicated closeout PR, per the
      F-030/F-031 convention of a separate bookkeeping-only PR after merge
      rather than self-pinning a branch-local SHA that dies on branch
      deletion. No CHARTER.md Section 3 carve-out needed, per
      .claude/skills/charter-carveout/SKILL.md's three-question procedure:
      (1) zero actuator/motion involvement -- all three components are
      read-side data egress (log/metric/episode forwarding), never a motor
      command; (2) zero LLM inference or training work, in or out of the
      hot loop -- CloudLoggingSink/CloudMetricsExporter/CloudFirestoreSync
      forward already-computed telemetry, they don't compute anything; (3)
      every new egress path is gated behind a schema field
      (gcp.logging.enabled / gcp.monitoring.enabled / gcp.firestore.enabled)
      that defaults False -- F-029 is the compensating control this
      depends on (recorded in depends_on above), per that change's own
      design.md D-5, so a bare `gcp:` block added for an unrelated reason
      still egresses nothing. Same exempt shape as the pre-existing
      build_cloud_telemetry_sink / build_cloud_experience_exporter
      precedent this bundle extends.

      Known, accepted risk in CloudLoggingSink (a pre-existing class this
      bundle wires into production for the first time, not new code added
      here): CloudLoggingSink.__call__ (cloud/logging_sink.py) calls
      google.cloud.logging's Logger.log_struct(...) synchronously -- not
      through the SDK's BackgroundThreadTransport, which only applies to
      the stdlib-logging.Handler integration this class doesn't use. Since
      the sink is installed as a global structlog processor and the
      orchestrator's tick() hot path logs through structlog too, an
      operator who sets gcp.logging.enabled=true could have a hot-loop log
      call (e.g. an emergency-stop event) block on outbound network I/O --
      touching CHARTER Section 4 invariants 1 (33.3ms cadence) and 10
      (hot-loop purity), reachable for the first time because nothing
      previously constructed CloudLoggingSink in production. The same
      __call__ also forwards event_dict content with only a primitive-type
      filter, no allow/deny list -- mission-command text already logged
      elsewhere in the tree (llm_gateway/mission_parser.py,
      orchestrator.py) would reach Cloud Logging verbatim once enabled.
      Both risks are dormant today: gcp.logging.enabled defaults False, so
      they activate only if an operator explicitly opts in. Surfaced to
      the operator directly (three independent review agents plus a
      self-directed pass found this during F-032's review) rather than
      fixed unilaterally, per CHARTER Section 6 ("escalate, don't
      unilaterally implement") -- redesigning CloudLoggingSink's I/O model
      is outside this bundle's own file scope (cloud/protocol.py,
      factory.py, orchestrator.py, main.py) and needs its own design/test
      cycle. Operator decision: ship F-032 as scoped, document the risk
      (this note), fix CloudLoggingSink in a separate future change --
      not yet assigned an F-number.

      Post-merge hotfix (this PR): the first F-032 PR (#206) was merged by
      the operator before a Copilot review round could be acted on, so the
      findings landed as a fresh hotfix on a restarted branch rather than a
      reopened PR, per this repo's own merged-branch convention. Two real,
      confirmed bugs, both traced to the same root cause: none of
      cloud/logging_sink.py, cloud/monitoring_exporter.py,
      cloud/firestore_sync.py (nor the two pre-existing siblings,
      cloud/pubsub_sink.py, cloud/experience_exporter.py) imports
      google.cloud.* at module scope -- every one defers that import into
      its own start() method -- so every builder's `except ImportError`
      around the lightweight mousedroid.cloud.<x> wrapper import never
      fired for a genuinely-missing SDK, and _start_cloud_subsystems's four
      cloud-collaborator .start() calls were unwrapped. An operator
      enabling gcp.monitoring.enabled/gcp.firestore.enabled (or, latently,
      the two pre-existing pubsub/storage toggles) without installing the
      [gcp] extra got a rover that failed to boot entirely, not a graceful
      degrade. Fixed in all five builders uniformly (not just the three new
      ones) via a genuine mousedroid.common.imports.module_available(...)
      probe against each builder's actual google.cloud.* submodule, plus
      wrapping all four _start_cloud_subsystems .start() calls in
      try/except Exception -- matching the pre-existing OTA-poller
      boot-resilience pattern three lines below. Fixing SDK-detection
      correctly flips tests/integration/test_factory_integration.py's GCP
      wiring test and three tests/unit/factory/test_factory_cloud_observability.py
      "enabled" cases to see None in this repo's own [gcp]-less CI, so all
      four gained pytest.importorskip guards in this same commit -- shipped
      together, never as a follow-up, since there is no intermediate state
      where both the fix and the unguarded tests are individually correct.
      Also in this hotfix: MouseDroidOrchestrator.__init__ gained a bare
      `*,` immediately before tool_registry, making the whole optional-param
      tail keyword-only (zero existing call sites were exploiting the gap,
      confirmed via an AST sweep of every call site in the tree -- latent
      hardening, not a live-bug fix); a third stale docs/architecture.md
      classDiagram (the `class Factory` block) gained the three missing
      builders; the Level 3d intro's blanket "protected by CircuitBreaker"
      claim was qualified to match the per-component Resilience table a few
      lines below (only the two pre-existing components use the real
      CircuitBreaker class); the two arity-check tests
      (test_logging_sink.py, test_firestore_sync.py) now actually assert
      parameter counts instead of calling inspect.signature() and
      discarding the result; and tests/unit/test_main.py's
      _FakeLoggingSink now mirrors the real CloudLoggingSink's _started
      gate so its cli_entry() test proves a live-forwarded event rather
      than one fired before start() was ever awaited.

      Closeout: the hotfix merged as PR #208 (69b9aa0), CI green (49/49
      checks) with zero unresolved review threads (one Copilot finding
      about the new try/except wrappers swallowing asyncio.CancelledError
      was investigated and confirmed a false positive -- CancelledError is
      a BaseException subclass since Python 3.8, not caught by except
      Exception, matching this file's own orchestrator/CLAUDE.md invariant
      and the pre-existing OTA-poller pattern the new wrappers mirror).
      implemented_in now pins 69b9aa0 rather than 94aa8d3 (PR #206's own
      merge) since that commit alone shipped the boot-crash bug this
      hotfix fixed -- 69b9aa0 is the first commit where F-032 is both
      wired AND correctly degrades when the [gcp] extra is absent.

  - id: "F-035"
    epic: "Deploy hygiene"
    name: "Gate-critical SHAs are tag-protected, not branch-protected"
    description: >-
      Adds scripts/repin_tags.sh, the mirror image of
      scripts/archive_stale_branches.sh: where that script REFUSES to delete a
      branch while it is the last thing keeping a pinned SHA reachable, this
      one removes the need for that refusal by tagging the SHA directly. Two
      pin families, both derived rather than hardcoded --
      deployments/jetson-image.json's deploy pin (tag prefix DEPLOY_NS) and
      every features.yaml implemented_in pin (namespace FEATURE_NS) -- named
      by full 40-char SHA so one tag covers features that share a pin
      (F-028/F-029 do). Dry-run by default; --push is an explicit operator
      action. Also corrects deployments/jetson-image.json's own notes, which
      asserted the SHA was "kept reachable by the annotated tag ... NOT by any
      branch" while zero tags existed on the remote and the SHA was in fact
      reachable only from stale feature branches.
    category: "infrastructure"
    priority: "medium"
    status: "in_progress"
    tier: "fast"
    verification:
      - "a dry run names every tag it would create and leaves both the remote and the local tag list untouched"
      - "--push creates ANNOTATED tags (not lightweight) on the remote for both pin families, named by full 40-char SHA"
      - "a re-run is idempotent: both pins report as already covered and no second tag is created"
      - "a SHA already reachable from a differently-named REMOTE tag counts as covered -- coverage is reachability, not naming"
      - "a deploy pin that is not 40 lowercase hex chars is rejected by the FORMAT check specifically, with a nonzero exit and no remote mutation -- asserted on the format-check message, because these values also fail the later resolve check and a bare nonzero-exit assertion passed with the format check deleted"
      - "a deploy pin naming a branch is rejected even though git cat-file resolves it -- the case format validation exists for, which a reachability check alone silently mis-tags"
      - "a well-formed but unresolvable pin exits nonzero rather than reporting a partial plan as success"
      - "REMOTE env override selects a different remote and leaves origin untouched"
      - "cross-script: after repin_tags.sh --push, archive_stale_branches.sh reports the same pin as 'carriers not needed' instead of protecting its branch"
    validation_command: "bash scripts/validations/F-035.sh"
    implemented_in: null
    depends_on: []
    notes: >-
      Ships with the deploy-repin skill (the F-036 half that backtick-references
      scripts/repin_tags.sh, so the two must land together or the skill-command
      validator fails on a dead path reference). No dependency on F-034: disjoint
      files. A real --push run is an operator action requiring separate explicit
      confirmation -- this feature covers building and dry-running the script
      only, so the tags it would create do not exist yet. implemented_in stays
      null until the dedicated closeout PR, per the F-030/F-031/F-032/F-034
      convention.

  - id: "F-034"
    epic: "Training Observability"
    name: "MLflow sqlite tracking default"
    description: >-
      Flips ExperimentLoggerConfig.tracking_uri's default from the legacy
      file-store URI (file:./mlruns) to sqlite:///mlflow.db, mlflow's own
      recommended local backend. mlflow 3.x hard-rejects the plain
      file-store backend without an explicit MLFLOW_ALLOW_FILE_STORE=true
      opt-in (already set unconditionally in mlflow_logger.py since PR
      #198); the sqlite default removes the dependency on that env-var
      workaround going forward and matches mlflow's documented production
      guidance. Adds sqlalchemy>=2.0,<3 and alembic>=1.13,<2 to the
      [mlflow] extra -- mlflow-skinny alone raises
      UnsupportedModelRegistryStoreURIException for any sqlite:/// URI
      without them, confirmed by constructing a real MlflowClient against
      one with only mlflow-skinny installed. Adds a new advisory
      mlflow-extras CI job (mirrors onnx-world-model-extras' shape) since
      no prior CI job installed the [mlflow] extra at all -- its "green"
      status never actually exercised mlflow. _resolve_tracking_uri
      (factory.py) is widened to pin relative sqlite:/// paths as well as
