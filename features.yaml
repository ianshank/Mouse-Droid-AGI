  - id: "F-022"
    epic: "Cognitive Integration"
    name: "Growth pillar wired as off-loop VLA distillation (default-OFF, soak-gated)"
    description: >-
      The growth pillar (knowledge distillation) is wired into the runtime as a
      default-OFF, off-loop background coordinator that distils the live VLA
      teacher policy into a compact StudentVLAPolicy over real on-policy (h, z)
      latents rolled from the live world model. KnowledgeDistiller gained a
      backwards-compatible regression (MSE) objective; the distilled student is
      persisted to a SHA-256 slot (GrowthSlotStore) and NEVER hot-swapped -
      deployment stays a soak-gated operator decision. GrowthConfig is
      Optional/None on Settings (enabled=False); build_growth_coordinator returns
      None when the block is absent/disabled OR no VLA teacher is wired. A gated
      pure-add {ns}_growth_distillations_total{outcome} counter surfaces on
      /metrics, omitted until the first cycle. Moves one of the three
      previously-unwired pillars (meta, growth, scaling) onto a runtime seam.
    category: "functional"
    priority: "medium"
    status: "in_progress"
    tier: "fast"
    verification:
      - "regression + classification distiller objectives both proven (classification byte-identical)"
      - "factory returns None when disabled / no-VLA; non-None + real distill cycle when enabled"
      - "default YAML loads unchanged; /metrics byte-identical until first cycle"
    validation_command: >-
      python -m pytest tests/unit/growth/
      tests/unit/factory/test_build_growth_coordinator.py
      tests/unit/orchestrator/test_growth_distill_loop.py
      tests/unit/telemetry/test_growth_metrics.py
      tests/regression/test_growth_distillation_aqa.py
      tests/regression/test_growth_backwards_compat.py -q
    implemented_in: null
    depends_on: ["F-001"]
    notes: >-
      Default-OFF + soak-gated: keep growth.enabled off on the live rover until a
      soak gate passes. Distils the Phase-3 VLA policy. implemented_in pins to the
      squash SHA post-merge (per the F-015..F-021 convention).

  - id: "F-023"
    epic: "Cognitive Integration"
    name: "AlayaWorld-adapted bounded-context memory + drift-reduction training (default-OFF)"
    description: >-
      Adapts two AlayaWorld ideas (arXiv:2607.18367) to the RSSM latent world
      model - NOT the paper's video-diffusion architecture. (1) A bounded-context
      latent memory (per-mission sink anchor + recent ring + EMA long-summary,
      constant-size storage) blended into the orchestrator-carried (h, z) at the
      observe seam; WorldModelMemoryConfig is Optional/None on Settings
      (enabled=False), build_latent_context returns None when absent/disabled and
      the tick path is byte-identical. (2) Corrupted-history drift-reduction
      training: RSSM.train_sequence_corrupted rolls a random open-loop prior
      prefix (the model's own drifted imagination) then trains the posterior
      suffix to recover; measure_drift + scripts/compare_drift.py provide the
      deterministic baseline-vs-augmented comparison (documented negative result
      acceptable). A scripts-only k-step imagination distillation spike
      (non-binding) produces a written go/no-go. RSSM is the feasibility vehicle;
      the DualStreamRSSM port is explicitly deferred (ADR-015).
    category: "functional"
    priority: "medium"
    status: "in_progress"
    tier: "fast"
    verification:
      - "memory footprint constant over long rollouts; disabled path byte-identical; sink incorporated into predictions (S1b test)"
      - "train_sequence_corrupted k=0 allclose-identical to train_sequence; RSSM state_dict keys unchanged; golden suites green"
      - "compare_drift.py produces a deterministic seeded baseline-vs-augmented report; spike report carries go/no-go + consumer-ceiling framing"
    validation_command: >-
      python -m pytest tests/unit/world_model/test_bounded_context.py
      tests/unit/world_model/test_train_sequence_corrupted.py
      tests/unit/training/test_drift_metrics.py
      tests/unit/training/test_drift_reduction.py
      tests/unit/factory/test_build_latent_context.py
      tests/unit/orchestrator/test_latent_context_tick.py
      tests/integration/test_compare_drift_script.py
      tests/integration/test_spike_step_distillation.py
      tests/regression/test_alayaworld_memory_distill_aqa.py
      tests/regression/test_alayaworld_memory_distill_backwards_compat.py -q
    implemented_in: null
    depends_on: ["F-001"]
    notes: >-
      OpenSpec change mouse-droid-alayaworld-memory-distill (archived under
      openspec/changes/; repo-native artifacts authoritative). Default-OFF:
      keep world_model_memory.enabled off on the live rover until a soak gate
      passes. Jetson spike run + on-rover drift eval are prepared via
      docs/runbooks/jetson-alayaworld-spike.md, not executed. implemented_in
      pins to the squash SHA post-merge (per the F-015..F-021 convention).

