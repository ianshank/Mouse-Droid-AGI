  - id: "F-025"
    epic: "Rover bring-up"
    name: "ESP32 driver speaks stock Waveshare firmware protocol"
    description: >-
      Retarget the ESP32 comms drivers at the stock Waveshare General_Driver
      command set (waveshareteam/ugv_base_general). The private
      {"T":1,"vx","vy","omega"} protocol has no firmware implementing it
      (firmware/ was never committed; scripts/flash_esp32.sh references a
      nonexistent binary), so on stock firmware motion commands parse as zeros,
      the {"T":2} battery poll is CMD_SET_MOTOR_PID (a write fired by
      assert_power_chain immediately before motion), and the e-stop command is
      unhandled. Scope: CMD_ROS_CTRL {"T":13,"X","Z"} velocity mapping (named
      constants sourced from json_cmd.h), chassis heartbeat failsafe
      (CMD_HEART_BEAT_SET at connect, window keyed to keepalive_hz), battery
      voltage from FEEDBACK_BASE_INFO (re-enables the 18650 undervoltage
      cutoff), 115200 default baud, and the encoder-less smoke re-scope
      (command ACKed + e-stop within budget replaces the unsatisfiable
      encoder-velocity criterion - audit R3). Backwards compatible via a
      protocol-selector config field so existing YAML loads unchanged.
    category: "functional"
    priority: "critical"
    status: "done"
    tier: "fast"
    verification:
      - "unit tests pin the stock command dicts (T=13 velocity, T=136 heartbeat, feedback voltage parse)"
      - "legacy protocol path stays byte-identical when the selector keeps its default"
      - "power_chain probe no longer emits a PID-write on the battery step under the stock selector"
