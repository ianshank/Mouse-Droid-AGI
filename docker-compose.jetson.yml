# =============================================================================
# MouseDroidAGI — Jetson Docker Compose (GPU + Hardware Passthrough)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.jetson.yml up -d
#   docker compose -f docker-compose.jetson.yml logs -f
#   docker compose -f docker-compose.jetson.yml down
# =============================================================================

services:
  mousedroid:
    container_name: mousedroid
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: mousedroid:jetson
    runtime: nvidia

    # --- Restart policy ---
    restart: unless-stopped

    # --- Environment ---
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MOUSEDROID_CONFIG=/etc/mousedroid/jetson_production.yaml
      - MOUSEDROID_MOCK_HARDWARE=${MOUSEDROID_MOCK_HARDWARE:-true}
      - CUDA_HOME=/usr/local/cuda

    # --- Volume mounts ---
    volumes:
      # Project source (editable install — code changes reflect immediately)
      - /opt/mousedroid:/opt/mousedroid
      # Configuration files
      - /etc/mousedroid:/etc/mousedroid:ro
      # Experience database (persistent)
      - mousedroid_experience:/home/jetson/mousedroid_experience
      # Thermal monitoring (read-only)
      - /sys/devices/virtual/thermal:/sys/devices/virtual/thermal:ro
      # GPU sysfs (read-only)
      - /sys/devices/platform:/sys/devices/platform:ro
      # Promtail positions (persistent across restarts)
      - promtail_positions:/var/lib/promtail

    # --- Hardware device passthrough ---
    # Device paths are configurable via env vars (see config/docker.env.example).
    # The container will fail to start if a listed device doesn't exist on the
    # host; ensure the preflight script passes before starting.
    devices:
      # ESP32 UART serial (required for motor control)
      - ${MOUSEDROID_ESP32_DEV:-/dev/ttyUSB0}:${MOUSEDROID_ESP32_DEV:-/dev/ttyUSB0}
      # Camera (required for vision)
      - ${MOUSEDROID_CAMERA_DEV:-/dev/video0}:${MOUSEDROID_CAMERA_DEV:-/dev/video0}
      # GPIO (required for ultrasonic trigger/echo)
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
      # FHL-LD19 LiDAR UART (optional — omit line if no LiDAR)
      - ${MOUSEDROID_LIDAR_DEV:-/dev/ttyUSB1}:${MOUSEDROID_LIDAR_DEV:-/dev/ttyUSB1}
      # Wonrabai USB Sound Card — ALSA audio in + out (optional)
      - /dev/snd:/dev/snd
    group_add:
      - audio
      - video
      - dialout
      - gpio

    # --- Health check ---
    # Polls the telemetry health endpoint; relies on a heartbeat file
    # written by the watchdog notifier after each successful tick.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${MOUSEDROID_TELEMETRY_PORT:-8080}/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    # --- Networking ---
    network_mode: host

    # --- Resource limits ---
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # --- Override entrypoint for development ---
    # Uncomment to get a shell instead of starting mousedroid:
    # entrypoint: ["/bin/bash"]
    # stdin_open: true
    # tty: true

volumes:
  mousedroid_experience:
    driver: local
  promtail_positions:
    driver: local
