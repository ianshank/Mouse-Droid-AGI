# =============================================================================
# MouseDroid — Jetson Docker Compose (GPU + Hardware Passthrough)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.jetson.yml up -d
#   docker compose -f docker-compose.jetson.yml logs -f
#   docker compose -f docker-compose.jetson.yml down
# =============================================================================

services:
  mousedroid:
    container_name: mousedroid
    build:
      context: .
      dockerfile: Dockerfile.jetson
      args:
        INSTALL_DEV_TOOLS: ${MOUSEDROID_INSTALL_DEV_TOOLS:-true}
    image: mousedroid:jetson
    runtime: nvidia
    # Required for Jetson.GPIO model detection via /proc/device-tree.
    privileged: true

    # --- Restart policy ---
    restart: unless-stopped

    # --- Shutdown window (S-1) ---
    # ``docker stop`` sends SIGTERM, then SIGKILL once this window expires.
    # SIGKILL cannot be handled, so anything still pending at that point is
    # lost — including the ``emergency_stop`` that halts the wheels.
    #
    # The budget inside this window is: ``loop.shutdown_grace_s`` (2 s) for
    # the 30 Hz loop to wind down, then ``orchestrator.stop()`` draining
    # background tasks, flushing the cloud sink and closing the telemetry
    # server and serial transport. Docker's default 10 s left almost no
    # margin for that tail; 30 s does, and costs nothing when shutdown is
    # quick — the container exits as soon as the process does.
    stop_grace_period: 30s

    # --- Environment ---
    # F-014: ``/etc/mousedroid/docker.env`` is the authoritative source for
    # per-host secrets and tunables (MOUSEDROID_TELEMETRY_TOKEN,
    # MOUSEDROID_MOCK_HARDWARE, MOUSEDROID_LLM__N_GPU_LAYERS, etc.). The
    # inline ``environment:`` block below ONLY carries values that:
    #   1. Must be host-shell-resolved at compose-up time (NVIDIA caps,
    #      GOOGLE_APPLICATION_CREDENTIALS), OR
    #   2. We always want to pin regardless of docker.env contents
    #      (MOUSEDROID_CONFIG path).
    #
    # Per Compose spec, inline ``environment:`` ALWAYS wins over ``env_file:``
    # values. We deliberately keep MOUSEDROID_TELEMETRY_TOKEN and
    # MOUSEDROID_MOCK_HARDWARE OUT of the inline block so that:
    #   - The token defined in docker.env actually reaches the container
    #     (previous Copilot-flagged crash-loop bug: the inline default
    #     ``${VAR:-}`` substitutes empty when the host shell var is unset,
    #     silently overriding whatever docker.env contained).
    #   - ``MOUSEDROID_MOCK_HARDWARE`` in docker.env is honoured directly
    #     (operator-managed = single source of truth, no precedence ambiguity).
    #
    # ``required: false`` is critical for first-time bringup and CI
    # ``docker compose config --quiet`` lint runs where /etc/mousedroid/
    # doesn't exist yet — without it compose fails immediately with
    # "env file not found".
    env_file:
      - path: /etc/mousedroid/docker.env
        required: false
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MOUSEDROID_CONFIG=/etc/mousedroid/jetson_production.yaml
      - CUDA_HOME=/usr/local/cuda
      # GCP Digital Twin (optional — set GCP_PROJECT_ID in host env or .env file to enable)
      # NOTE: do NOT set MOUSEDROID_GCP__PROJECT_ID here with a default of ""; an
      # empty string causes pydantic-settings to construct GCPConfig(project_id="")
      # which fails validation. Omit the var entirely so gcp stays None (offline mode).
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}

    # --- Volume mounts ---
    volumes:
      # Project source (editable install — code changes reflect immediately)
      - /opt/mousedroid:/opt/mousedroid
      # Configuration files
      - /etc/mousedroid:/etc/mousedroid:ro
      # Libargus socket required for CSI camera access from inside the container
      - /tmp/argus_socket:/tmp/argus_socket
      # Stable serial-device symlinks for ESP32 and LiDAR config paths
      - /dev/serial:/dev/serial:ro
      # Experience database (persistent)
      - mousedroid_experience:/home/jetson/mousedroid_experience
      # Thermal monitoring (read-only)
      - /sys/devices/virtual/thermal:/sys/devices/virtual/thermal:ro
      # GPU sysfs (read-only)
      - /sys/devices/platform:/sys/devices/platform:ro
      # Promtail positions (persistent across restarts)
      - promtail_positions:/var/lib/promtail
      # TensorRT engine + timing cache (persistent across --force-recreate).
      #
      # The container path is NOT a literal: it is the very same variable
      # pydantic-settings reads for ``cfg.jetson.tensorrt_cache_dir``
      # (env_prefix MOUSEDROID_ + env_nested_delimiter __, see
      # config/schema/root.py), so compose and the schema cannot drift. The
      # ``:-`` default restates the schema default
      # (config/schema/hardware.py::JetsonConfig.tensorrt_cache_dir) only so
      # that an un-provisioned host still starts; set the key ONCE in
      # /etc/mousedroid/docker.env to move the cache, and both the mount and
      # the Python config follow. That works because the docker.env keys reach
      # the *compose process* environment on both start paths —
      # mousedroid-docker.service's ``EnvironmentFile=-/etc/mousedroid/docker.env``
      # and docker_deploy.sh's ``set -a; . docker.env; set +a`` — whereas the
      # ``env_file:`` directive above only injects into the container and is
      # invisible to compose interpolation.
      #
      # This is a nested mount UNDER the /opt/mousedroid bind mount above
      # (docker sorts mount destinations by depth, so the volume wins for this
      # subpath). That is deliberate and load-bearing twice over: the engine
      # plan survives container recreation, AND the cache never appears in
      # ``git status`` inside the rover checkout — which is what keeps
      # scripts/rover_wip_guard.sh's dirty-target refusal from firing on
      # machine-generated build output.
      #
      # NO WEIGHTS MOUNT, for the record: weights persist transitively, via
      # ``WORKDIR /opt/mousedroid`` (Dockerfile.jetson) plus the *relative*
      # ``world_model.onnx_cache_dir`` default ("weights/dual_stream_rssm",
      # config/schema/world_model.py) resolving to
      # /opt/mousedroid/weights/dual_stream_rssm — i.e. inside the bind mount
      # already declared above. Adding a weights volume would shadow that
      # directory and silently orphan anything already downloaded there.
      # HF_HOME is likewise unset and so not persisted; it is out of scope
      # here because the ONNX artifact lands in onnx_cache_dir, not the hub
      # cache, once the factory has resolved it.
      - mousedroid_tensorrt_cache:${MOUSEDROID_JETSON__TENSORRT_CACHE_DIR:-/opt/mousedroid/tensorrt_cache}
      # GCP service account credentials (optional — mount if using file-based auth)
      - ${GCP_CREDENTIALS_FILE:-/dev/null}:/etc/gcp/credentials.json:ro

    # --- Hardware device passthrough ---
    # Device paths are configurable via env vars (see config/docker.env.example).
    # The container will fail to start if a listed device doesn't exist on the
    # host; ensure the preflight script passes before starting.
    devices:
      # ESP32 UART serial (required for motor control)
      - ${MOUSEDROID_ESP32_DEV:-/dev/ttyUSB0}:${MOUSEDROID_ESP32_DEV:-/dev/ttyUSB0}
      # Camera (required for vision)
      - ${MOUSEDROID_CAMERA_DEV:-/dev/video0}:${MOUSEDROID_CAMERA_DEV:-/dev/video0}
      # GPIO (required for ultrasonic trigger/echo)
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
      # FHL-LD19 LiDAR UART (optional — omit line if no LiDAR)
      - ${MOUSEDROID_LIDAR_DEV:-/dev/ttyUSB1}:${MOUSEDROID_LIDAR_DEV:-/dev/ttyUSB1}
      # Wonrabai USB Sound Card — ALSA audio in + out (optional)
      - /dev/snd:/dev/snd
      # SSD1306 OLED face display on header I²C bus (optional — omit if no panel)
      - ${MOUSEDROID_FACE_DISPLAY_DEV:-/dev/i2c-7}:${MOUSEDROID_FACE_DISPLAY_DEV:-/dev/i2c-7}
    group_add:
      - audio
      - video
      - dialout
      # NOTE: 'i2c' group_add removed (PR #45 review): JetPack base images do
      # not always define an 'i2c' Unix group, which would block container
      # start. privileged: true + explicit /dev/i2c-7 passthrough already
      # grants full I²C access for the SSD1306 OLED face panel.
      # Some JetPack images do not define a gpio Unix group; privileged mode
      # plus explicit /dev/gpiochip* passthrough is the actual access path.

    # --- Health check ---
    # Delegates to /usr/local/bin/mousedroid_healthcheck.sh (baked into
    # the image, see Dockerfile.jetson). The script reads the heartbeat
    # path and staleness threshold from /run/mousedroid.env, which the
    # entrypoint writes from cfg.loop.* — no values are duplicated
    # between this compose file and the Python config. Requires
    # cfg.loop.watchdog_enabled=true (set in config/jetson_production.yaml).
    healthcheck:
      test: ["CMD", "/usr/local/bin/mousedroid_healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    # --- Networking ---
    network_mode: host

    # --- Resource limits ---
    #
    # RESOURCE BUDGET DECISION (F-051 task 8.0) — recorded, deliberate, and
    # deliberately NOT a change in this round.
    #
    # State: a 6 GiB memory cap on ~7.4 GiB usable RAM, with no
    # ``memswap_limit``, no ``shm_size`` and no ``pids_limit``. Unbounded swap
    # is the one that actually bites: a container at its memory cap with swap
    # available thrashes instead of being OOM-killed and restarted cleanly, and
    # every swapped page fault taken inside the synchronous
    # ``_update_world_model`` call counts against ``loop.tick_timeout_s`` (1.0 s,
    # config/schema/misc.py). A thrashing rover misses ticks silently; a killed
    # one comes back under ``restart: unless-stopped`` and its heartbeat gap is
    # visible to the HEALTHCHECK. Restarting cleanly is the better failure mode.
    #
    # DECISION: leave all three unset here, and bound swap in the SAME change
    # that first enables on-device TensorRT engine builds — not before.
    # Rationale:
    #   1. Nothing in this change builds an engine on the rover. The task-2.1
    #      decision gate closed against I/O binding / FP16 / an engine cache
    #      (computed end-to-end ceiling 1.0016x-1.0039x), and
    #      ``world_model.engine`` stays "torch". The volume above and the
    #      provider probe in docker_deploy.sh are infrastructure that is
    #      correct IF ever enabled; the memory profile that would justify
    #      re-cutting the swap budget does not exist yet, and a number chosen
    #      without it would be invented, not measured.
    #   2. ``memswap_limit`` is a hard failure mode if mis-set: the daemon
    #      rejects a MemorySwap that is not strictly greater than Memory, and a
    #      rejected HostConfig does not degrade — the container refuses to
    #      start. That is not a change to land untested on a rover that is
    #      currently bench-blocked behind F-008.
    #   3. The operator-side guards that exist today already cover the failure
    #      this would pre-empt: the campaign plan's B0 step requires >=8 GiB
    #      free (``df -h /`` + ``docker system df -v``, reclaim with
    #      scripts/jetson_disk_cleanup.sh) and NVMe swap recorded via
    #      ``swapon --show`` + ``zramctl`` before any build
    #      (docs/superpowers/plans/2026-07-25-jetson-deploy-and-validation-campaign.md).
    #
    # WHEN IT FLIPS, set all three together and in this order:
    #   memswap_limit: equal to the memory limit  (=> zero swap for this cgroup,
    #                  so the cap is enforced by the OOM killer, not by paging)
    #   shm_size:      sized from the DataLoader/IPC footprint an engine build
    #                  actually shows (64 MiB default is a real ceiling for
    #                  torch shared-memory tensors)
    #   pids_limit:    a measured ceiling, not a round number — the tick loop
    #                  plus telemetry plus ORT's provider threads
    # and re-run the promotion with ``scripts/docker_deploy.sh --strict-health``
    # so a start failure is fatal rather than a warn.
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Config overlay passed to entrypoint (overrides Dockerfile CMD default)
    command: ["--config", "/etc/mousedroid/jetson_production.yaml"]

    # --- Override entrypoint for development ---
    # Uncomment to get a shell instead of starting mousedroid:
    # entrypoint: ["/bin/bash"]
    # command: []
    # stdin_open: true
    # tty: true

volumes:
  mousedroid_experience:
    driver: local
  promtail_positions:
    driver: local
  # TensorRT engine/timing cache — see the mount comment in the service above
  # for why the container-side path comes from
  # MOUSEDROID_JETSON__TENSORRT_CACHE_DIR (= cfg.jetson.tensorrt_cache_dir)
  # rather than being written out here.
  mousedroid_tensorrt_cache:
    driver: local
