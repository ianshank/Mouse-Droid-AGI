# =============================================================================
# MouseDroidAGI — Jetson Docker Compose (GPU + Hardware Passthrough)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.jetson.yml up -d
#   docker compose -f docker-compose.jetson.yml logs -f
#   docker compose -f docker-compose.jetson.yml down
# =============================================================================

services:
  mousedroid:
    container_name: mousedroid
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: mousedroid:jetson
    runtime: nvidia

    # --- Override entrypoint/CMD for production config ---
    entrypoint: ["python3", "-m", "mousedroid.main"]
    command: ["--config", "/etc/mousedroid/default.yaml", "/etc/mousedroid/jetson_production.yaml"]

    # --- Restart policy ---
    restart: unless-stopped

    # --- Environment ---
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MOUSEDROID_CONFIG=/etc/mousedroid/jetson_production.yaml
      - MOUSEDROID_MOCK_HARDWARE=${MOUSEDROID_MOCK_HARDWARE:-true}
      - CUDA_HOME=/usr/local/cuda

    # --- Volume mounts ---
    volumes:
      # Project source (editable install — code changes reflect immediately)
      - /opt/mousedroid:/opt/mousedroid
      # Configuration files
      - /etc/mousedroid:/etc/mousedroid:ro
      # Experience database (persistent)
      - mousedroid_experience:/home/jetson/mousedroid_experience
      # Thermal monitoring (read-only)
      - /sys/devices/virtual/thermal:/sys/devices/virtual/thermal:ro
      # GPU sysfs (read-only)
      - /sys/devices/platform:/sys/devices/platform:ro

    # --- Hardware device passthrough ---
    # All devices required for production deployment.
    # Device paths are configurable via env vars in docker.env.
    # If a device is absent at startup, Docker will fail fast with a clear error.
    devices:
      # ESP32 UART serial (motor controller + encoders + battery)
      - ${MOUSEDROID_ESP32_DEV:-/dev/ttyUSB0}:/dev/ttyUSB0
      # CSI / USB camera
      - ${MOUSEDROID_CAMERA_DEV:-/dev/video0}:/dev/video0
      # Jetson GPIO chips
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
      # FHL-LD19 LiDAR UART
      - ${MOUSEDROID_LIDAR_DEV:-/dev/ttyUSB1}:/dev/ttyUSB1
      # Wonrabai USB Sound Card (ALSA audio — mic + speaker)
      - /dev/snd:/dev/snd
    group_add:
      - audio
      - video
      - dialout

    # --- Health check ---
    # Polls the telemetry health endpoint; marks container unhealthy after 3 failures.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${MOUSEDROID_TELEMETRY_PORT:-8080}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    # --- Networking ---
    network_mode: host

    # --- Resource limits ---
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # --- Override entrypoint for development ---
    # Uncomment to get a shell instead of starting mousedroid:
    # entrypoint: ["/bin/bash"]
    # stdin_open: true
    # tty: true

volumes:
  mousedroid_experience:
    driver: local
