# =============================================================================
# MouseDroidAGI — Jetson Docker Compose (GPU + Hardware Passthrough)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.jetson.yml up -d
#   docker compose -f docker-compose.jetson.yml logs -f
#   docker compose -f docker-compose.jetson.yml down
# =============================================================================

services:
  mousedroid:
    container_name: mousedroid
    build:
      context: .
      dockerfile: Dockerfile.jetson
      args:
        INSTALL_DEV_TOOLS: ${MOUSEDROID_INSTALL_DEV_TOOLS:-true}
    image: mousedroid:jetson
    runtime: nvidia
    # Required for Jetson.GPIO model detection via /proc/device-tree.
    privileged: true

    # --- Restart policy ---
    restart: unless-stopped

    # --- Environment ---
    # F-014: ``/etc/mousedroid/docker.env`` is the authoritative source for
    # per-host secrets and tunables (MOUSEDROID_TELEMETRY_TOKEN,
    # MOUSEDROID_MOCK_HARDWARE, MOUSEDROID_LLM__N_GPU_LAYERS, etc.). The
    # inline ``environment:`` block below ONLY carries values that:
    #   1. Must be host-shell-resolved at compose-up time (NVIDIA caps,
    #      GOOGLE_APPLICATION_CREDENTIALS), OR
    #   2. We always want to pin regardless of docker.env contents
    #      (MOUSEDROID_CONFIG path).
    #
    # Per Compose spec, inline ``environment:`` ALWAYS wins over ``env_file:``
    # values. We deliberately keep MOUSEDROID_TELEMETRY_TOKEN and
    # MOUSEDROID_MOCK_HARDWARE OUT of the inline block so that:
    #   - The token defined in docker.env actually reaches the container
    #     (previous Copilot-flagged crash-loop bug: the inline default
    #     ``${VAR:-}`` substitutes empty when the host shell var is unset,
    #     silently overriding whatever docker.env contained).
    #   - ``MOUSEDROID_MOCK_HARDWARE`` in docker.env is honoured directly
    #     (operator-managed = single source of truth, no precedence ambiguity).
    #
    # ``required: false`` is critical for first-time bringup and CI
    # ``docker compose config --quiet`` lint runs where /etc/mousedroid/
    # doesn't exist yet — without it compose fails immediately with
    # "env file not found".
    env_file:
      - path: /etc/mousedroid/docker.env
        required: false
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MOUSEDROID_CONFIG=/etc/mousedroid/jetson_production.yaml
      - CUDA_HOME=/usr/local/cuda
      # GCP Digital Twin (optional — set GCP_PROJECT_ID in host env or .env file to enable)
      # NOTE: do NOT set MOUSEDROID_GCP__PROJECT_ID here with a default of ""; an
      # empty string causes pydantic-settings to construct GCPConfig(project_id="")
      # which fails validation. Omit the var entirely so gcp stays None (offline mode).
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}

    # --- Volume mounts ---
    volumes:
      # Project source (editable install — code changes reflect immediately)
      - /opt/mousedroid:/opt/mousedroid
      # Configuration files
      - /etc/mousedroid:/etc/mousedroid:ro
      # Libargus socket required for CSI camera access from inside the container
      - /tmp/argus_socket:/tmp/argus_socket
      # Stable serial-device symlinks for ESP32 and LiDAR config paths
      - /dev/serial:/dev/serial:ro
      # Experience database (persistent)
      - mousedroid_experience:/home/jetson/mousedroid_experience
      # Thermal monitoring (read-only)
      - /sys/devices/virtual/thermal:/sys/devices/virtual/thermal:ro
      # GPU sysfs (read-only)
      - /sys/devices/platform:/sys/devices/platform:ro
      # Promtail positions (persistent across restarts)
      - promtail_positions:/var/lib/promtail
      # GCP service account credentials (optional — mount if using file-based auth)
      - ${GCP_CREDENTIALS_FILE:-/dev/null}:/etc/gcp/credentials.json:ro

    # --- Hardware device passthrough ---
    # Device paths are configurable via env vars (see config/docker.env.example).
    # The container will fail to start if a listed device doesn't exist on the
    # host; ensure the preflight script passes before starting.
    devices:
      # ESP32 UART serial (required for motor control)
      - ${MOUSEDROID_ESP32_DEV:-/dev/ttyUSB0}:${MOUSEDROID_ESP32_DEV:-/dev/ttyUSB0}
      # Camera (required for vision)
      - ${MOUSEDROID_CAMERA_DEV:-/dev/video0}:${MOUSEDROID_CAMERA_DEV:-/dev/video0}
      # GPIO (required for ultrasonic trigger/echo)
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
      # FHL-LD19 LiDAR UART (optional — omit line if no LiDAR)
      - ${MOUSEDROID_LIDAR_DEV:-/dev/ttyUSB1}:${MOUSEDROID_LIDAR_DEV:-/dev/ttyUSB1}
      # Wonrabai USB Sound Card — ALSA audio in + out (optional)
      - /dev/snd:/dev/snd
      # SSD1306 OLED face display on header I²C bus (optional — omit if no panel)
      - ${MOUSEDROID_FACE_DISPLAY_DEV:-/dev/i2c-7}:${MOUSEDROID_FACE_DISPLAY_DEV:-/dev/i2c-7}
    group_add:
      - audio
      - video
      - dialout
      # NOTE: 'i2c' group_add removed (PR #45 review): JetPack base images do
      # not always define an 'i2c' Unix group, which would block container
      # start. privileged: true + explicit /dev/i2c-7 passthrough already
      # grants full I²C access for the SSD1306 OLED face panel.
      # Some JetPack images do not define a gpio Unix group; privileged mode
      # plus explicit /dev/gpiochip* passthrough is the actual access path.

    # --- Health check ---
    # Delegates to /usr/local/bin/mousedroid_healthcheck.sh (baked into
    # the image, see Dockerfile.jetson). The script reads the heartbeat
    # path and staleness threshold from /run/mousedroid.env, which the
    # entrypoint writes from cfg.loop.* — no values are duplicated
    # between this compose file and the Python config. Requires
    # cfg.loop.watchdog_enabled=true (set in config/jetson_production.yaml).
    healthcheck:
      test: ["CMD", "/usr/local/bin/mousedroid_healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    # --- Networking ---
    network_mode: host

    # --- Resource limits ---
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Config overlay passed to entrypoint (overrides Dockerfile CMD default)
    command: ["--config", "/etc/mousedroid/jetson_production.yaml"]

    # --- Override entrypoint for development ---
    # Uncomment to get a shell instead of starting mousedroid:
    # entrypoint: ["/bin/bash"]
    # command: []
    # stdin_open: true
    # tty: true

volumes:
  mousedroid_experience:
    driver: local
  promtail_positions:
    driver: local
