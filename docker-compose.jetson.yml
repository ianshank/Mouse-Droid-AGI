# =============================================================================
# MouseDroidAGI — Jetson Docker Compose (GPU + Hardware Passthrough)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.jetson.yml up -d
#   docker compose -f docker-compose.jetson.yml logs -f
#   docker compose -f docker-compose.jetson.yml down
# =============================================================================

services:
  mousedroid:
    container_name: mousedroid
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: mousedroid:jetson
    runtime: nvidia
    # Hardware access: prefer explicit device passthrough over privileged=true.
    # Jetson.GPIO requires access to /dev/gpiochip* and /proc/device-tree (read-only).
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
      - /sys/devices/platform:/sys/devices/platform:ro

    # --- Command override ---
    # Use jetson production config with real hardware (GPIO devices passed through above).
    command: ["--config", "/etc/mousedroid/jetson_production.yaml"]

    # --- Restart policy ---
    restart: unless-stopped

    # --- Environment ---
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MOUSEDROID_CONFIG=/etc/mousedroid/jetson_production.yaml
      - MOUSEDROID_MOCK_HARDWARE=${MOUSEDROID_MOCK_HARDWARE:-false}
      - CUDA_HOME=/usr/local/cuda
      # LLM gateway — model path resolved via YAML config or env override
      - MOUSEDROID_LLM_GATEWAY__MODEL_PATH=${MOUSEDROID_LLM_MODEL_PATH:-}

    # --- Volume mounts ---
    volumes:
      # Project source (editable install — code changes reflect immediately)
      - /opt/mousedroid:/opt/mousedroid
      # Configuration files
      - /etc/mousedroid:/etc/mousedroid:ro
      # Experience database (persistent)
      - mousedroid_experience:/home/jetson/mousedroid_experience
      # LLM model weights (read-only host volume)
      - ${MOUSEDROID_LLM_MODELS_DIR:-/home/ian/models}:/home/jetson/models:ro
      # Thermal monitoring (read-only)
      - /sys/devices/virtual/thermal:/sys/devices/virtual/thermal:ro
      # GPU sysfs (read-only)
      - /sys/devices/platform:/sys/devices/platform:ro

    # --- Hardware device passthrough ---
    # Privileged mode grants access to all host devices (/dev/gpiochip*,
    # /dev/ttyUSB*, /dev/video*, etc.) and /proc/device-tree for Jetson.GPIO.

    # --- Networking ---
    network_mode: host

    # --- Resource limits ---
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # --- Override entrypoint for development ---
    # Uncomment to get a shell instead of starting mousedroid:
    # entrypoint: ["/bin/bash"]
    # stdin_open: true
    # tty: true

volumes:
  mousedroid_experience:
    driver: local
