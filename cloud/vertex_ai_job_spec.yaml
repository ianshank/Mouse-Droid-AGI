# =============================================================================
# Vertex AI Custom Training Job — Tier C1 closed-loop cloud retraining.
# =============================================================================
# Applied via:
#   gcloud ai custom-jobs create \
#     --region=us-central1 \
#     --display-name=mousedroid-cloud-train \
#     --config=cloud/vertex_ai_job_spec.yaml
#
# Operator must set:
#   * imageUri — pushed Dockerfile.cloud image (e.g. gcr.io/<project>/mousedroid-cloud:tier-c1)
#   * the GCS bucket name in args (replace ``REPLACE_BUCKET``) and pinned
#     ``shard_consumed_marker`` prefix.
#   * HUGGINGFACE_HUB_TOKEN Vertex AI secret (Secret Manager binding).
#
# Idempotency contract (ADR-010): the trainer checks ``shard_consumed_marker``
# in GCS before processing each LMDB shard so Jetson exporter restarts that
# re-upload shard N do NOT double-train.
# =============================================================================
workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-8
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: REPLACE_GCR_PATH/mousedroid-cloud:tier-c1
      env:
        - name: MOUSEDROID_CLOUD_TRAIN_CONFIG
          value: /etc/mousedroid/cloud_train.yaml
        - name: HUGGINGFACE_HUB_TOKEN
          # SECURITY: HUGGINGFACE_HUB_TOKEN is grade-A privileged — it
          # authorises push to ianshank/mousedroid-*. NEVER embed in
          # plaintext. Bind via Secret Manager so the secret value never
          # appears in the job spec, container env-dump, or Vertex AI
          # audit logs. (Gemini security-high.)
          valueFrom:
            secretKeyRef:
              name: REPLACE_WITH_SECRET_MANAGER_SECRET_NAME
              version: latest
      args:
        # --shard-consumed-marker-uri is consumed by training/train_offline_rl.py
        # to gate the per-job GCS idempotency check (existence check at startup,
        # blob write on success). The trainer does NOT read
        # MOUSEDROID_SHARD_CONSUMED_MARKER_PREFIX; pass the marker URI here
        # explicitly. (Copilot 3253293678 / 3253310030.)
        #
        # NOTE: --push-to-hf / --hf-repo-id / --hf-artifact-filename were
        # removed from the trainer because the upload module
        # (training/upload_weights.py) does not exist yet. The Vertex AI job
        # spec will gain them back when that follow-up PR lands; until then
        # the trainer's output remains in GCS and an operator hands off to
        # `huggingface-cli upload`.
        - --lmdb-shards-gcs-prefix
        - gs://REPLACE_BUCKET/experience_shards/
        - --shard-consumed-marker-uri
        - gs://REPLACE_BUCKET/cloud_train/shard_consumed_marker/run_id_placeholder

# Optional: scheduled execution. Operators uncomment + customise once they're
# ready to run nightly retraining.
# schedule:
#   cron: "0 3 * * *"  # 03:00 UTC nightly
#   timeZone: UTC
